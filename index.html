<script>
(function(){
'use strict';

/* ---------- constants ---------- */
const COMPANIES = { GP:'Great Polonia', GG:'Great Greece', ALL:'Obie firmy' };
const CO_SHORT = { GP:'GP', GG:'GG', ALL:'GP+GG' };
const STATUSES = {
  wyslane:{label:'Wysłane', open:true},
  w_realizacji:{label:'W realizacji', open:true},
  czeka_na_mnie:{label:'Czekają na mnie', open:true},
  naprawione:{label:'Naprawione', open:false},
  odrzucone:{label:'Odrzucone / zbyte', open:false},
  zamkniete:{label:'Zamknięte', open:false}
};
const STATUS_LABELS = Object.fromEntries(Object.entries(STATUSES).map(([k, v]) => [k, v.label]));
/* Three groups shown as counters: every status belongs to exactly one. */
const GROUPS = {
  aktywne:{label:'Aktywne', sub:'wysłane, czekają na GuestSage', statuses:['wyslane']},
  w_trakcie:{label:'W trakcie', sub:'w realizacji lub czekają na Ciebie', statuses:['w_realizacji','czeka_na_mnie']},
  zakonczone:{label:'Zakończone', sub:'naprawione, odrzucone, zamknięte', statuses:['naprawione','odrzucone','zamkniete']}
};
/* Objects as listed on greatpolonia.pl and greatgreecehotels.gr. `re` finds an object in a pasted e-mail (text without Polish letters). */
const PROPERTIES = [
  {id:'wroclaw-tumski', short:'Wrocław Tumski', city:'Wrocław', co:'GP', url:'https://wroclawtumski.greatpolonia.pl/', re:/tumski/},
  {id:'wroclaw-cc', short:'Wrocław City Center', city:'Wrocław', co:'GP', url:'https://wroclaw.greatpolonia.pl/', re:/wroclaw city|city cent(er|re) wroclaw/},
  {id:'river-boat', short:'River Boat Apartments', city:'Wrocław', co:'GP', url:'https://riverboat.greatpolonia.pl/', re:/river\s*boat/},
  {id:'granary', short:'The Granary La Suite', city:'Wrocław', co:'GP', url:'https://granary.greatpolonia.pl/', re:/granary/},
  {id:'dwarf', short:'Dwarf Wrocław', city:'Wrocław', co:'GP', url:'https://dwarfwroclaw.greatpolonia.pl/', re:/dwarf/},
  {id:'swidnica', short:'Świdnica City Center', city:'Świdnica', co:'GP', url:'https://swidnica.greatpolonia.pl/', re:/swidnic/},
  {id:'strzegom', short:'Strzegom City Center', city:'Strzegom', co:'GP', url:'https://strzegom.greatpolonia.pl/', re:/strzegom/},
  {id:'jelenia-gora', short:'Jelenia Góra City Center', city:'Jelenia Góra', co:'GP', url:'https://jeleniagora.greatpolonia.pl/', re:/jelenia|jeleniej/},
  {id:'umi', short:'Umi Hotel Sopot', city:'Sopot', co:'GP', url:'https://umihotel.greatpolonia.pl/', re:/\bumi\b|sopot/},
  {id:'puck', short:'Beach & Molo', city:'Puck', co:'GP', url:'https://puck.greatpolonia.pl/', re:/beach (&|and|i) molo|\bpuck/},
  {id:'ustka', short:'Ustka', city:'Ustka', co:'GP', url:'https://ustka.greatpolonia.pl/', re:/ustk/},
  {id:'mielno', short:'Sand Beach Mielno', city:'Mielno', co:'GP', url:'https://mielno.greatpolonia.pl/', re:/mielno|sand beach/},
  {id:'silesian', short:'Silesian Katowice', city:'Katowice', co:'GP', url:'https://www.katowicesilesian.greatpolonia.pl/', re:/silesian|katowic/},
  {id:'krakow-kazimierz', short:'Kraków Kazimierz', city:'Kraków', co:'GP', url:'https://krakow.greatpolonia.pl/', re:/kazimierz/},
  {id:'krakow-cc', short:'Kraków City Center', city:'Kraków', co:'GP', url:'https://krakowcitycenter.greatpolonia.pl/', re:/krakow city|city cent(er|re) krakow/},
  {id:'krakow-airport', short:'Kraków Airport', city:'Kraków', co:'GP', url:'https://krakowairport.greatpolonia.pl/', re:/krakow airport|balice/},
  {id:'conrad', short:'Conrad Kraków', city:'Kraków', co:'GP', url:'https://conradkrakow.greatpolonia.pl/', re:/conrad/},
  {id:'velvet', short:'Velvet Suwałki', city:'Suwałki', co:'GP', url:'https://velvetsuwalki.greatpolonia.pl/', re:/velvet|suwalk/},
  {id:'le-convivial', short:'Le Convivial Suites & Spa', city:'Xylokastro', co:'GG', url:'https://greatgreecehotels.gr/', re:/convivial|xylokastro/}
];
const propById = id => PROPERTIES.find(p => p.id === id);
const propFromHash = v => /^obiekt-/.test(v || '') ? propById(v.slice(7)) : null;
const fold = s => String(s || '').toLowerCase().normalize('NFD').replace(/\p{M}/gu, '').replace(/ł/g, 'l');
/* Great Greece has one object, so older GG entries without an object belong to Le Convivial. */
function propsOf(x){
  const a = (x.properties || []).filter(propById);
  return a.length ? a : (x.company === 'GG' ? ['le-convivial'] : []);
}
const propsText = x => propsOf(x).map(id => propById(id).short).join(', ');
const detectProps = text => { const f = fold(text); return PROPERTIES.filter(p => p.re.test(f)).map(p => p.id); };
const groupOf = t => Object.keys(GROUPS).find(g => GROUPS[g].statuses.includes(t.status)) || 'aktywne';
const PRIORITIES = { niski:'Niski', sredni:'Średni', wysoki:'Wysoki', krytyczny:'Krytyczny' };
const PRIO_RANK = { krytyczny:0, wysoki:1, sredni:2, niski:3 };
const KINDS = {
  wyslane:'Wysłanie zgłoszenia',
  odpowiedz:'Odpowiedź GuestSage',
  ponaglenie:'Ponaglenie',
  notatka:'Notatka',
  status:'Zmiana statusu'
};
const CHANNELS = ['E-mail','Portal / system zgłoszeń','Czat','Telefon','Inne'];
const MODULES = ['Rezerwacje','Check-in online','Wiadomości do gości','Integracja z PMS','Płatności','Raporty','Ankiety / opinie','Aplikacja mobilna','Inne'];
const VIEWS = [
  {id:'pulpit', label:'Pulpit', icon:'<svg viewBox="0 0 24 24"><path d="M4 11l8-7 8 7v9h-5v-6H9v6H4z"/></svg>'},
  {id:'dziennik', label:'Dziennik', icon:'<svg viewBox="0 0 24 24"><path d="M6 3h11a2 2 0 012 2v16H8a2 2 0 01-2-2z"/><path d="M6 17a2 2 0 012-2h11M10 7h6M10 11h4"/></svg>'},
  {id:'zgloszenia', label:'Zgłoszenia', icon:'<svg viewBox="0 0 24 24"><path d="M4 7a2 2 0 002-2h12a2 2 0 002 2v2a3 3 0 000 6v2a2 2 0 00-2 2H6a2 2 0 00-2-2v-2a3 3 0 000-6z"/><path d="M10 5v14"/></svg>'},
  {id:'obiekty', label:'Obiekty', icon:'<svg viewBox="0 0 24 24"><path d="M4 21V6l8-3v18M12 9l8 3v9M2 21h20M7 8h2M7 12h2M7 16h2M15 14h2M15 18h2"/></svg>'},
  {id:'dowody', label:'Dowody', icon:'<svg viewBox="0 0 24 24"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>'},
  {id:'prowizje', label:'Prowizje', icon:'<svg viewBox="0 0 24 24"><path d="M5 19L19 5"/><circle cx="7" cy="7" r="2.5"/><circle cx="17" cy="17" r="2.5"/></svg>'}
];
const IC_FILE = '<svg viewBox="0 0 24 24"><path d="M7 3h7l5 5v13H7z"/><path d="M14 3v5h5"/></svg>';
const IC_VIDEO = '<svg viewBox="0 0 24 24"><rect x="3" y="6" width="13" height="12" rx="2"/><path d="M16 10l5-3v10l-5-3"/></svg>';
const IC_NOTE = '<svg viewBox="0 0 24 24"><path d="M5 4h14v16H5z"/><path d="M9 9h6M9 13h6M9 17h3"/></svg>';
const IMG_OK = ['image/png','image/jpeg','image/gif','image/webp'];
const BUCKET = 'dowody';
const BLANK = 'data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==';

/* ---------- state ---------- */
const S = {
  user:null, ready:false, loadError:null, lastLoad:0,
  tickets:[], journal:[], evidence:[], settings:{threshold:3, staleDays:7},
  view:'pulpit',
  tf:{status:'open', company:'all', q:'', sort:'silence'},
  jf:{company:'all', q:'', range:'30', limitDays:40},
  propId:null, pf:'all', pq:'', pOpen:false,
  commissions:[], cm:{month:null}, cmSaved:null,
  ef:{company:'all', q:''},
  detailId:null, evidenceId:null, evDraft:null, composerKind:'odpowiedz'
};
function lsGet(k, d){ try{ const v = localStorage.getItem('dgs:'+k); return v == null ? d : v; }catch(e){ return d; } }
function lsSet(k, v){ try{ localStorage.setItem('dgs:'+k, v); }catch(e){} }
function lsDel(k){ try{ localStorage.removeItem('dgs:'+k); }catch(e){} }

/* ---------- helpers ---------- */
const $ = (s, r) => (r || document).querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2, '0');
const ymd = d => d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate());
const todayStr = () => ymd(new Date());
const nowLocal = () => { const d = new Date(); return ymd(d) + 'T' + pad(d.getHours()) + ':' + pad(d.getMinutes()); };
function parseLocal(s){
  if(!s) return null;
  const [d, t] = String(s).split('T');
  const [y, m, dd] = d.split('-').map(Number);
  const [h, mi] = (t || '00:00').split(':').map(Number);
  const r = new Date(y, (m||1)-1, dd||1, h||0, mi||0);
  return isNaN(r) ? null : r;
}
function daysSince(s){
  const d = parseLocal(s); if(!d) return null;
  const a = new Date(); a.setHours(0,0,0,0);
  const b = new Date(d); b.setHours(0,0,0,0);
  return Math.round((a - b) / 864e5);
}
function daysBetween(a, b){
  const x = parseLocal(a), y = parseLocal(b); if(!x || !y) return null;
  x.setHours(0,0,0,0); y.setHours(0,0,0,0);
  return Math.round((y - x) / 864e5);
}
function fmtDate(s){
  const d = parseLocal(s); if(!d) return '—';
  const o = {day:'numeric', month:'short'};
  if(d.getFullYear() !== new Date().getFullYear()) o.year = 'numeric';
  return d.toLocaleDateString('pl-PL', o);
}
function fmtDateTime(s){
  const d = parseLocal(s); if(!d) return '—';
  return fmtDate(s) + (String(s).includes('T') ? ', ' + pad(d.getHours()) + ':' + pad(d.getMinutes()) : '');
}
const fmtLong = s => { const d = parseLocal(s); return d ? d.toLocaleDateString('pl-PL', {weekday:'long', day:'numeric', month:'long', year: d.getFullYear() !== new Date().getFullYear() ? 'numeric' : undefined}) : '—'; };
function plDays(n){ return n === 1 ? '1 dzień' : n + ' dni'; }
function plural(n, one, few, many){
  const m10 = n % 10, m100 = n % 100;
  if(n === 1) return one;
  if(m10 >= 2 && m10 <= 4 && (m100 < 12 || m100 > 14)) return few;
  return many;
}
const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
const uuid = () => (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : uid() + uid();
const tnum = t => 'GS-' + String(t.num || 0).padStart(3, '0');
const chip = c => '<span class="chip ' + esc(c || 'ALL') + '">' + esc(CO_SHORT[c] || 'GP+GG') + '</span>';
const coMatch = (c, f) => f === 'all' || c === f || c === 'ALL';
function startOfWeek(d){ const x = new Date(d); x.setHours(0,0,0,0); x.setDate(x.getDate() - ((x.getDay() + 6) % 7)); return x; }
function opts(map, sel){ return Object.entries(map).map(([v, l]) => '<option value="' + v + '"' + (v === sel ? ' selected' : '') + '>' + esc(l) + '</option>').join(''); }

function toast(msg){
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), 2800);
}
async function copyText(text){
  try{ await navigator.clipboard.writeText(text); toast('Skopiowano do schowka'); return true; }
  catch(e){
    const ta = document.createElement('textarea'); ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    let ok = false; try{ ok = document.execCommand('copy'); }catch(_){}
    ta.remove();
    toast(ok ? 'Skopiowano do schowka' : 'Nie udało się skopiować — zaznacz tekst ręcznie');
    return ok;
  }
}
function saveFile(filename, data, mime){
  const blob = new Blob([data], {type: mime || 'text/plain;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 5000);
}
function arm(btn, label){
  if(btn.dataset.armed === '1') return true;
  const orig = btn.textContent;
  btn.dataset.armed = '1'; btn.classList.add('armed'); btn.textContent = label || 'Na pewno? Kliknij ponownie';
  setTimeout(() => { if(btn.isConnected){ btn.dataset.armed = ''; btn.classList.remove('armed'); btn.textContent = orig; } }, 4000);
  return false;
}

/* ---------- Supabase data layer ---------- */
const CFG = window.DGS_CONFIG || {};
const configured = !!(CFG.supabaseUrl && CFG.supabaseKey && /^https:\/\//.test(CFG.supabaseUrl) && !/WKLEJ/.test(CFG.supabaseUrl + CFG.supabaseKey));
const sb = (configured && window.supabase) ? window.supabase.createClient(CFG.supabaseUrl, CFG.supabaseKey, {auth:{persistSession:true, autoRefreshToken:true, detectSessionInUrl:false}}) : null;

const camel = k => k.replace(/_([a-z])/g, (_, c) => c.toUpperCase());
const snake = k => k.replace(/[A-Z]/g, c => '_' + c.toLowerCase());
function fromRow(r){ const o = {}; for(const k in r) o[camel(k)] = r[k]; return o; }
function toRow(o){ const r = {}; for(const k in o){ if(k === 'id' || k === 'userId') continue; r[snake(k)] = o[k]; } return r; }
const STORE = { tickets:'tickets', journal:'journal', evidence:'evidence', commissions:'commissions' };

function errMsg(e){
  const m = (e && (e.message || e.error_description || e.error)) || '';
  if(/Failed to fetch|NetworkError|Load failed|fetch failed/i.test(m)) return navigator.onLine === false
    ? 'Brak połączenia z internetem.'
    : 'Nie można połączyć się z bazą danych. Darmowa baza Supabase mogła zostać uśpiona po kilku dniach bez używania: zaloguj się na supabase.com, otwórz projekt dziennik-guestsage i kliknij „Restore project”.';
  if(/JWT|not authenticated|401/i.test(m)) return 'Sesja wygasła. Zaloguj się ponownie.';
  if(/row-level security|permission denied/i.test(m)) return 'Brak uprawnień do zapisu. Sprawdź, czy schemat SQL został uruchomiony.';
  return m || 'nieznany błąd';
}
async function run(fn){
  try{ await fn(); return true; }
  catch(e){ console.error(e); toast('Nie udało się zapisać: ' + errMsg(e)); return false; }
}
function upsertLocal(table, row){
  const arr = S[STORE[table]];
  const i = arr.findIndex(x => x.id === row.id);
  if(i >= 0) arr[i] = row; else arr.push(row);
}
const DB = {
  async fetchAll(table){
    const out = [];
    for(let from = 0; ; from += 1000){
      const {data, error} = await sb.from(table).select('*').range(from, from + 999);
      if(error) throw error;
      out.push(...data.map(fromRow));
      if(data.length < 1000) break;
    }
    return out;
  },
  async insert(table, obj){
    const {data, error} = await sb.from(table).insert(toRow(obj)).select().single();
    if(error) throw error;
    const row = fromRow(data); upsertLocal(table, row); render(); return row;
  },
  async update(table, id, obj){
    const {data, error} = await sb.from(table).update(toRow(obj)).eq('id', id).select().single();
    if(error) throw error;
    const row = fromRow(data); upsertLocal(table, row); render(); return row;
  },
  async remove(table, id){
    const {error} = await sb.from(table).delete().eq('id', id);
    if(error) throw error;
    S[STORE[table]] = S[STORE[table]].filter(x => x.id !== id); render();
  },
  async saveSettings(patch){
    const s = Object.assign({}, S.settings, patch);
    const {error} = await sb.from('settings').upsert({user_id:S.user.id, threshold:s.threshold, stale_days:s.staleDays, login_photo:s.loginPhoto || null, commission_name:s.commissionName || null});
    if(error) throw error;
    S.settings = s; applyLoginPhoto(s.loginPhoto); render();
  }
};
async function loadAll(){
  try{
    const [t, j, e, cm, s] = await Promise.all([
      DB.fetchAll('tickets'), DB.fetchAll('journal'), DB.fetchAll('evidence'), DB.fetchAll('commissions'),
      sb.from('settings').select('*').maybeSingle()
    ]);
    if(s.error) throw s.error;
    S.tickets = t; S.journal = j; S.evidence = e; S.commissions = cm;
    S.settings = s.data
      ? {threshold:s.data.threshold || 3, staleDays:s.data.stale_days || 7, loginPhoto:s.data.login_photo || null, commissionName:s.data.commission_name || ''}
      : {threshold:3, staleDays:7, loginPhoto:null, commissionName:''};
    applyLoginPhoto(S.settings.loginPhoto);
    if(!S.ready) S.enter = true;
    S.ready = true; S.loadError = null; S.lastLoad = Date.now();
  }catch(err){
    console.error(err);
    S.loadError = errMsg(err);
  }
  render();
}

/* Files in Supabase Storage (private bucket, signed URLs) */
const URLS = new Map();
let urlsAt = Date.now();
const URLQ = new Set(), PENDING = new Set();
let urlTimer = null;
function mediaAttr(path, attr){
  const u = URLS.get(path);
  return attr + '="' + esc(u || (attr === 'src' ? BLANK : '#')) + '" data-path="' + esc(path) + '" data-attr="' + attr + '"';
}
function patchUrls(){
  document.querySelectorAll('[data-path]').forEach(el => {
    const p = el.dataset.path, u = URLS.get(p);
    if(u){ if(el.getAttribute(el.dataset.attr) !== u) el.setAttribute(el.dataset.attr, u); }
    else if(!URLS.has(p) && !PENDING.has(p)) URLQ.add(p);
  });
  if(URLQ.size && !urlTimer) urlTimer = setTimeout(flushUrls, 0);
}
async function flushUrls(){
  urlTimer = null;
  const paths = Array.from(URLQ); URLQ.clear();
  if(!paths.length || !sb) return;
  paths.forEach(p => PENDING.add(p));
  try{
    const {data, error} = await sb.storage.from(BUCKET).createSignedUrls(paths, 60 * 60 * 12);
    if(error) throw error;
    (data || []).forEach(r => URLS.set(r.path, r.signedUrl || ''));
  }catch(e){ console.error(e); }
  paths.forEach(p => { PENDING.delete(p); if(!URLS.has(p)) URLS.set(p, ''); });
  patchUrls();
}
const Files = {
  async upload(file, type){
    const ext = ({'image/jpeg':'jpg','image/png':'png','image/gif':'gif','image/webp':'webp','application/pdf':'pdf','video/mp4':'mp4','video/quicktime':'mov','video/webm':'webm'})[type]
      || ((file.name || '').split('.').pop() || 'bin').toLowerCase().replace(/[^a-z0-9]/g, '').slice(0, 6) || 'bin';
    const path = S.user.id + '/' + uuid() + '.' + ext;
    const {error} = await sb.storage.from(BUCKET).upload(path, file, {contentType:type, cacheControl:'3600', upsert:false});
    if(error) throw error;
    try{ URLS.set(path, URL.createObjectURL(file)); }catch(e){}
    return path;
  },
  async remove(paths){
    paths = (paths || []).filter(Boolean);
    if(!paths.length) return;
    const {error} = await sb.storage.from(BUCKET).remove(paths);
    if(error) console.error(error);
  }
};

/* ---------- ticket logic ---------- */
const isOpen = t => !!(STATUSES[t.status] || STATUSES.wyslane).open;
function sortedEvents(t){ return (t.events || []).slice().sort((a, b) => (a.at || '') < (b.at || '') ? -1 : (a.at || '') > (b.at || '') ? 1 : 0); }
function silence(t){
  if(!isOpen(t) || t.status === 'czeka_na_mnie') return null;
  const ev = sortedEvents(t);
  let lastOut = null, lastIn = null;
  for(const e of ev){
    if(e.kind === 'wyslane' || e.kind === 'ponaglenie') lastOut = e.at;
    if(e.kind === 'odpowiedz') lastIn = e.at;
  }
  if(!lastOut) lastOut = t.sentAt;
  if(!lastOut || (lastIn && lastIn >= lastOut)) return null;
  const days = daysSince(lastOut);
  const pings = ev.filter(e => e.kind === 'ponaglenie' && (!lastIn || e.at > lastIn)).length;
  return {days, since:lastOut, pings, overdue: days >= S.settings.threshold};
}
function lastActivity(t){ const ev = sortedEvents(t); return ev.length ? ev[ev.length-1].at : t.sentAt; }
function isStale(t){
  if(!isOpen(t)) return false;
  const s = silence(t); if(s && s.overdue) return false;
  const d = daysSince(lastActivity(t));
  return d != null && d >= S.settings.staleDays;
}
function firstResponseDays(t){
  const ev = sortedEvents(t);
  const out = (ev.find(e => e.kind === 'wyslane') || {}).at || t.sentAt;
  const resp = ev.find(e => e.kind === 'odpowiedz');
  if(!out || !resp) return null;
  const a = parseLocal(out), b = parseLocal(resp.at);
  if(!a || !b) return null;
  return Math.max(0, (b - a) / 864e5);
}
function gsStats(list){
  const all = list || S.tickets;
  const resp = all.map(firstResponseDays).filter(v => v != null);
  const never = all.filter(t => t.status !== 'zamkniete' && !(t.events || []).some(e => e.kind === 'odpowiedz') && (daysSince(t.sentAt) || 0) >= S.settings.threshold);
  const fixed = all.filter(t => t.status === 'naprawione').length;
  const rejected = all.filter(t => t.status === 'odrzucone').length;
  const pings = all.reduce((n, t) => n + (t.events || []).filter(e => e.kind === 'ponaglenie').length, 0);
  return {
    total: all.length, fixed, rejected, pings, never: never.length,
    avgResp: resp.length ? resp.reduce((a, b) => a + b, 0) / resp.length : null,
    fixRate: all.length ? Math.round(fixed / all.length * 100) : null
  };
}
function silenceBadge(t){
  const s = silence(t);
  if(s && s.overdue) return '<span class="badge danger">Cisza ' + plDays(s.days) + (s.pings ? ' · ' + s.pings + '× ponaglone' : '') + '</span>';
  if(s) return '<span class="badge">' + (s.days <= 0 ? 'Wysłane dziś' : 'Czeka ' + plDays(s.days)) + '</span>';
  if(t.status === 'czeka_na_mnie') return '<span class="badge you">Twój ruch</span>';
  if(isStale(t)) return '<span class="badge warn">Bez postępu ' + plDays(daysSince(lastActivity(t))) + '</span>';
  return '';
}
function propTag(x){
  const ids = propsOf(x); if(!ids.length) return '';
  return '<span class="ptag">' + esc(propById(ids[0]).short) + (ids.length > 1 ? ' +' + (ids.length - 1) : '') + '</span>';
}

function journalFiltered(){
  const f = S.jf, q = f.q.trim().toLowerCase();
  const now = new Date(); now.setHours(0,0,0,0);
  const sow = startOfWeek(now), psow = new Date(sow); psow.setDate(psow.getDate() - 7);
  return S.journal.filter(j => {
    if(!coMatch(j.company, f.company)) return false;
    if(q && !String(j.text || '').toLowerCase().includes(q)) return false;
    const d = parseLocal(j.date); if(!d) return f.range === 'all';
    switch(f.range){
      case 'week': return d >= sow;
      case 'lastweek': return d >= psow && d < sow;
      case 'month': return d.getFullYear() === now.getFullYear() && d.getMonth() === now.getMonth();
      case '30': return (now - d) / 864e5 < 30;
      default: return true;
    }
  });
}

    if(f.status in GROUPS && groupOf(t) !== f.status) return false;

  const sil = t => { const s = silence(t); return s ? s.days + (s.overdue ? 1000 : 0) : (isStale(t) ? 500 : -1); };
  if(f.sort === 'silence') list.sort((a, b) => sil(b) - sil(a) || ((a.sentAt || '') < (b.sentAt || '') ? 1 : -1));

  return list;

/* ---------- commissions ---------- */
function money(n){
  const v = (Math.round((Number(n) || 0) * 100) / 100).toFixed(2).split('.');
  return v[0].replace(/\B(?=(\d{3})+(?!\d))/g, ' ') + ',' + v[1] + ' zł';
}
function parseMoney(s){
  const c = String(s == null ? '' : s).replace(/[\s\u00a0]/g, '').replace(/zł/i, '').replace(',', '.');
  return c === '' ? NaN : Number(c);
}
const calcAmount = (price, rate) => Math.round(price * rate + 1e-7) / 100;
const percent = r => String(Number(r).toFixed(2)).replace('.', ',') + '%';
function stayLabel(a, b){
  const x = parseLocal(a), y = parseLocal(b || a); if(!x || !y) return '—';
  const dm = d => pad(d.getDate()) + '.' + pad(d.getMonth() + 1);
  if(a === b || !b) return dm(x);
  if(x.getMonth() === y.getMonth() && x.getFullYear() === y.getFullYear()) return pad(x.getDate()) + '-' + dm(y);
  return dm(x) + '-' + dm(y);
}
const monthOf = c => String(c.stayFrom || '').slice(0, 7);
function monthLabel(key){
  if(key === 'all') return 'wszystkie miesiące';
  const [y, m] = key.split('-').map(Number);
  return new Date(y, m - 1, 1).toLocaleDateString('pl-PL', {month:'long', year:'numeric'});
}
function cmMonths(){
  const set = new Set(S.commissions.map(monthOf).filter(Boolean));
  set.add(todayStr().slice(0, 7));
  return Array.from(set).sort().reverse();
}
function cmCurrent(){
  if(S.cm.month) return S.cm.month;
  const has = S.commissions.map(monthOf).filter(Boolean).sort();
  return has.length ? has[has.length - 1] : todayStr().slice(0, 7);
}
function cmList(month){
  return S.commissions.filter(c => month === 'all' || monthOf(c) === month)
    .sort((a, b) => (a.stayFrom || '') < (b.stayFrom || '') ? -1 : (a.stayFrom || '') > (b.stayFrom || '') ? 1 : ((a.createdAt || '') < (b.createdAt || '') ? -1 : 1));
}
const sumOf = (list, key) => Math.round(list.reduce((n, c) => n + (Number(c[key]) || 0), 0) * 100) / 100;
function cmPropOptions(sel){

function readCm(prefix){
  const v = k => (document.getElementById(prefix + k).value || '').trim();
  const reservationId = v('Id'), stayFrom = v('From'), stayTo = v('To') || stayFrom, price = parseMoney(v('Price')), rate = parseMoney(v('Rate'));
  if(!reservationId){ toast('Wpisz ID rezerwacji.'); return null; }
  if(!stayFrom){ toast('Wpisz datę pobytu.'); return null; }
  if(stayTo < stayFrom){ toast('Data „do” jest wcześniejsza niż „od”.'); return null; }
  if(!isFinite(price) || price < 0){ toast('Wpisz poprawną cenę, np. 4243,50.'); return null; }
  if(!isFinite(rate) || rate < 0 || rate > 100){ toast('Wpisz prowizję od 0 do 100%.'); return null; }
  return {reservationId, stayFrom, stayTo, price, rate, amount:calcAmount(price, rate), property:v('Prop') || null};
}
async function submitCommission(){
  const data = readCm('cm'); if(!data) return;

}

const loadScript = src => new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = rej; document.head.appendChild(s); });
function pdfLib(){
  if(pdfLib.p) return pdfLib.p;
  const b64 = async url => {
    const r = await fetch(url); if(!r.ok) throw new Error('font');
    const buf = new Uint8Array(await r.arrayBuffer());
    let s = ''; for(let i = 0; i < buf.length; i += 0x8000) s += String.fromCharCode.apply(null, buf.subarray(i, i + 0x8000));
    return btoa(s);
  };
  pdfLib.p = Promise.all([
    window.jspdf ? null : loadScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js'),
    b64('fonts/DejaVuSans.ttf'), b64('fonts/DejaVuSans-Bold.ttf')
  ]).then(([, regular, bold]) => ({regular, bold})).catch(e => { pdfLib.p = null; throw e; });
  return pdfLib.p;
}
async function commissionPdf(list, month){
  const fonts = await pdfLib();
  const doc = new window.jspdf.jsPDF({unit:'mm', format:'a4', compress:true});
  doc.addFileToVFS('DejaVuSans.ttf', fonts.regular); doc.addFont('DejaVuSans.ttf', 'DejaVu', 'normal');
  doc.addFileToVFS('DejaVuSans-Bold.ttf', fonts.bold); doc.addFont('DejaVuSans-Bold.ttf', 'DejaVu', 'bold');
  const left = 14, cols = [52, 40, 36, 22, 32], width = cols.reduce((a, b) => a + b, 0), rowH = 8;
  const name = S.settings.commissionName || (S.user && S.user.email) || '';
  const cellsAt = (y, values, style, fill) => {
    let x = left;
    values.forEach((v, i) => {
      doc.setFillColor(...fill); doc.setDrawColor(255, 255, 255); doc.rect(x, y, cols[i], rowH, 'FD');
      doc.setFont('DejaVu', style); doc.setFontSize(style === 'bold' ? 11 : 10.5); doc.setTextColor(0, 0, 0);
      doc.text(String(v), x + cols[i] / 2, y + rowH / 2 + 1.3, {align:'center'});
      x += cols[i];
    });
  };
  const rates = new Set(list.map(c => Number(c.rate)));
  const head = ['ID REZERWACJI', 'Data Pobytu', 'Cena Full', rates.size === 1 ? String(Array.from(rates)[0]).replace('.', ',') + '%' : '%', 'Total'];
  const top = y => {
    doc.setFillColor(155, 181, 30); doc.rect(left, y, width, 14, 'F');
    doc.setFont('DejaVu', 'bold'); doc.setFontSize(17); doc.setTextColor(0, 0, 0);
    doc.text(name, left + width / 2, y + 9.4, {align:'center'});
    cellsAt(y + 14, head, 'bold', [153, 153, 153]);
    return y + 14 + rowH;
  };
  doc.setFont('DejaVu', 'normal'); doc.setFontSize(10); doc.setTextColor(70, 70, 70);
  doc.text('Prowizje: ' + monthLabel(month), left, 13);
  let y = top(16);
  list.forEach((c, i) => {
    if(y + rowH > 280){ doc.addPage(); y = top(14); }
    cellsAt(y, [c.reservationId, stayLabel(c.stayFrom, c.stayTo), money(c.price), percent(c.rate), money(c.amount)], 'normal', i % 2 ? [192, 192, 192] : [208, 208, 208]);
    y += rowH;
  });
  if(y + rowH > 280){ doc.addPage(); y = 14; }
  cellsAt(y, ['Razem', '', money(sumOf(list, 'price')), '', money(sumOf(list, 'amount'))], 'bold', [155, 181, 30]);
  return doc.output('blob');
}
async function deliverPdf(blob, filename){
  const f = new File([blob], filename, {type:'application/pdf'});
  const ios = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  if(ios && navigator.canShare && navigator.canShare({files:[f]})){
    try{ await navigator.share({files:[f], title:filename}); return; }
    catch(e){ if(e && e.name === 'AbortError') return; }
  }
  saveFile(filename, blob, 'application/pdf');
}

function withPreserved(root, fn){
  const vals = {};

    vals[el.id] = (el.type === 'checkbox' || el.type === 'radio') ? {c:el.checked} : {v:el.value};

  const aid = a && root.contains(a) && a.id ? a.id : null;
  let sel = null;
  if(aid){ try{ sel = [a.selectionStart, a.selectionEnd]; }catch(e){} }
  fn();

const reducedMotion = () => window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
function countUp(root){
  if(reducedMotion()) return;
  root.querySelectorAll('.stat .v, .fact .v').forEach(el => {
    const m = el.textContent.match(/^(\d+)(%?)$/); if(!m) return;
    const target = +m[1], suffix = m[2]; if(target < 2) return;
    const t0 = performance.now(), dur = 750;
    const step = now => {
      const p = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - p, 3);
      el.textContent = Math.round(target * e) + suffix;
      if(p < 1 && el.isConnected) requestAnimationFrame(step);
    };
    el.textContent = '0' + suffix; requestAnimationFrame(step);
  });
}

function go(view){
  if(!RENDER[view]) view = 'pulpit';
  if(view === 'obiekty' && S.view === 'obiekty' && S.propId){ propClose(); return; }
  const changed = view !== S.view;
  if(changed && S.pendingView === view) return;
  const from = VIEWS.findIndex(v => v.id === S.view), to = VIEWS.findIndex(v => v.id === view);
  const commit = () => {
    S.pendingView = null;
    if(changed) S.enter = true;
    if(view !== 'obiekty') S.propId = null;
    if(view !== 'prowizje') S.cmSaved = null;
    S.view = view; lsSet('view', view);
    if(location.hash.slice(1) !== view){ try{ history.replaceState(null, '', '#' + view); }catch(e){} }
    render(); window.scrollTo(0, 0);
  };
  if(changed && S.user && S.ready){ S.pendingView = view; fxPlay(VIEWS[to].label, commit, to < from); }
  else commit();
}

const fx = document.getElementById('fx'), fxLabel = document.getElementById('fxLabel');
let fxTimers = [], fxMid = null;
function fxFlush(){ const m = fxMid; fxMid = null; if(m) m(); }
/* Neon bands sweep across the screen; `mid` runs while the screen is fully covered. */
function fxPlay(label, mid, reverse){
  if(reducedMotion()){ if(mid) mid(); return; }
  fxTimers.forEach(clearTimeout); fxTimers = [];
  fxFlush();
  fxMid = mid || null;
  fxLabel.textContent = label || '';
  fx.hidden = false;
  fx.classList.remove('run');
  fx.classList.toggle('rev', !!reverse);
  void fx.offsetWidth;
  fx.classList.add('run');
  fxTimers.push(setTimeout(fxFlush, 285));
  fxTimers.push(setTimeout(() => { fx.classList.remove('run'); fx.hidden = true; }, 620));
}
const GLYPHS = '#%&/<>=+*01_';
function decrypt(el, dur){
  if(!el || reducedMotion()) return;
  const txt = el.textContent, t0 = performance.now();
  dur = dur || 480;
  const step = now => {
    if(!el.isConnected) return;
    const p = Math.min(1, (now - t0) / dur), shown = Math.floor(p * txt.length);
    let s = txt.slice(0, shown);
    for(let i = shown; i < txt.length; i++) s += /\s/.test(txt[i]) ? txt[i] : GLYPHS[Math.floor(Math.random() * GLYPHS.length)];
    el.textContent = p < 1 ? s : txt;
    if(p < 1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}

/* ---------- ticket from a pasted e-mail ---------- */
const MONTHS = {
  jan:1, feb:2, mar:3, apr:4, may:5, jun:6, jul:7, aug:8, sep:9, oct:10, nov:11, dec:12,
  sty:1, lut:2, kwi:4, maj:5, cze:6, lip:7, sie:8, wrz:9, 'paź':10, paz:10, lis:11, gru:12
};
function monthNum(word){
  const w = String(word || '').toLowerCase();
  if(MONTHS[w.slice(0, 3)]) return MONTHS[w.slice(0, 3)];
  const pl = {stycz:1, lut:2, marz:3, marc:3, kwie:4, maj:5, czerw:6, lip:7, sierp:8, wrze:9, 'paźdz':10, pazdz:10, listop:11, grud:12};
  for(const k in pl) if(w.startsWith(k)) return pl[k];
  return 0;
}
function parseMailDate(s){
  if(!s) return '';
  const ap = s.match(/\d{1,2}:\d{2}(?::\d{2})?\s*([ap])\.?\s*m\b\.?/i);
  const mk = (y, m, d, h, mi) => {
    y = +y; m = +m; d = +d; h = +h || 0;
    if(!y || !m || !d || m > 12 || d > 31) return '';
    if(ap){ const pm = ap[1].toLowerCase() === 'p'; if(pm && h < 12) h += 12; if(!pm && h === 12) h = 0; }
    return y + '-' + pad(m) + '-' + pad(d) + 'T' + pad(+h || 0) + ':' + pad(+mi || 0);
  };
  let m;
  if((m = s.match(/(\d{4})-(\d{1,2})-(\d{1,2})(?:[ T,]+(\d{1,2}):(\d{2}))?/))) return mk(m[1], m[2], m[3], m[4], m[5]);
  if((m = s.match(/(\d{1,2})[./](\d{1,2})[./](\d{4})(?:\D{1,8}(\d{1,2}):(\d{2}))?/))) return mk(m[3], m[2], m[1], m[4], m[5]);
  if((m = s.match(/(\d{1,2})\s+([A-Za-ząćęłńóśźżĄĆĘŁŃÓŚŹŻ]{3,})\.?,?\s+(\d{4})(?:\D{1,8}(\d{1,2}):(\d{2}))?/))) return mk(m[3], monthNum(m[2]), m[1], m[4], m[5]);
  if((m = s.match(/([A-Za-z]{3,})\.?\s+(\d{1,2}),?\s+(\d{4})(?:\D{1,8}(\d{1,2}):(\d{2}))?/))) return mk(m[3], monthNum(m[1]), m[2], m[4], m[5]);
  return '';
}
const MODULE_HINTS = [
  [/check[- ]?in/i, 'Check-in online'], [/rezerwac|booking|reservation/i, 'Rezerwacje'],
  [/wiadomo|message|sms|e-?mail do go/i, 'Wiadomości do gości'], [/\bpms\b|synchroniz|integrac/i, 'Integracja z PMS'],
  [/płatno|platno|payment|faktur|invoice/i, 'Płatności'], [/raport|report/i, 'Raporty'],
  [/ankiet|opini|review|survey/i, 'Ankiety / opinie'], [/aplikac|\bapp\b|mobile/i, 'Aplikacja mobilna']
];
function parseEmail(raw){
  const text = String(raw || '').replace(/\r\n?/g, '\n').trim();
  const lines = text.split('\n');
  const HDR = /^\s*\**\s*(od|from|do|to|dw|cc|temat|subject|data|date|wysłano|wysłane|sent)\s*\**\s*:\s*(.*)$/i;
  const KEY = {od:'from', from:'from', do:'to', to:'to', dw:'cc', cc:'cc', temat:'subject', subject:'subject', data:'date', date:'date', 'wysłano':'date', 'wysłane':'date', sent:'date'};
  const hdr = {}; let lastHdr = -1;
  for(let k = 0; k < Math.min(lines.length, 16); k++){
    const m = lines[k].match(HDR);
    if(m){ const key = KEY[m[1].toLowerCase()]; if(!(key in hdr)) hdr[key] = m[2].trim(); lastHdr = k; }
    else if(lastHdr >= 0 && lines[k].trim() === '') break;
  }
  let body = (lastHdr >= 0 ? lines.slice(lastHdr + 1) : lines).join('\n');
  const cut = body.match(/^(?:\s*>.*|.*\b(?:wrote|napisał\(a\)|napisał|napisała|pisze)\s*:\s*|\s*-{2,}\s*(?:original message|wiadomość oryginalna|oryginalna wiadomość).*|_{6,}.*|\s*\**\s*(?:od|from)\s*\**\s*:\s.+)$/im);
  if(cut && cut.index > 15) body = body.slice(0, cut.index);
  body = body.replace(/[ \t]+\n/g, '\n').replace(/\n{3,}/g, '\n\n').trim();
  let subject = (hdr.subject || '').replace(/^\s*((re|odp|fw|fwd|pd|aw|wg|tr)\s*(\[\d+\])?\s*:\s*)+/i, '').trim();
  if(!subject){
    const first = body.split('\n').map(s => s.trim()).find(s => s && !/^(dzień dobry|dzien dobry|witam|hello|hi|dear|szanown|cześć|czesc)\b/i.test(s));
    subject = (first || 'Zgłoszenie z maila').replace(/[.:]+$/, '');
  }
  subject = subject.slice(0, 160);
  const hay = (hdr.subject || '') + '\n' + text;
  const refM = hay.match(/(?:ticket|zg[łl]oszeni[ea]|case|request|incident|sprawa)\s*(?:id|nr|no\.?|number|numer)?\s*[:#.]?\s*#?\s*([A-Z]{0,6}-?\d{3,})/i)
    || hay.match(/\[\s*#?([A-Z]{1,6}-?\d{2,})\s*\]/) || hay.match(/(?:^|\s)#(\d{3,})\b/);
  const low = text.toLowerCase();
  const gp = (low.match(/polonia/g) || []).length, gg = (low.match(/greece|grecj|greek/g) || []).length;
  const mod = MODULE_HINTS.find(([re]) => re.test(hay));
  return {
    subject, body: body.slice(0, 8000), from: hdr.from || '',
    gsRef: refM ? refM[1] : '',
    at: parseMailDate(hdr.date || ''),
    fromGS: /guest\s*sage/i.test(hdr.from || ''),
    company: gp && gg ? 'ALL' : gg ? 'GG' : gp ? 'GP' : '',
    module: mod ? mod[1] : ''
  };
}
const normTitle = s => String(s || '').toLowerCase().replace(/^\s*((re|odp|fw|fwd)\s*:\s*)+/i, '').replace(/[^a-z0-9ąćęłńóśźż]+/g, ' ').trim();
function matchTicket(p){
  if(p.gsRef){
    const r = p.gsRef.replace(/\D/g, '');
    const t = S.tickets.find(t => t.gsRef && t.gsRef.replace(/\D/g, '') === r);
    if(t) return t;
  }
  const s = normTitle(p.subject);
  if(s.length < 6) return null;
  return S.tickets.find(t => { const n = normTitle(t.title); return n.length >= 6 && (n === s || s.includes(n) || n.includes(s)); }) || null;
}

async function toJpeg(file){
  const url = URL.createObjectURL(file);
  try{
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
    const max = 2400; let w = img.naturalWidth, h = img.naturalHeight;
    const sc = Math.min(1, max / Math.max(w, h)); w = Math.round(w * sc); h = Math.round(h * sc);
    const c = document.createElement('canvas'); c.width = w; c.height = h;
    c.getContext('2d').drawImage(img, 0, 0, w, h);
    const blob = await new Promise(r => c.toBlob(r, 'image/jpeg', 0.85));
    if(!blob) throw new Error('encode');
    return new File([blob], (file.name || 'zrzut').replace(/\.[^.]+$/, '') + '.jpg', {type:'image/jpeg'});
  } finally { URL.revokeObjectURL(url); }
}
async function uploadFiles(fileList){
  const d = S.evDraft; if(!d) return;
  const files = Array.from(fileList || []); if(!files.length) return;
  d.uploading += files.length; renderEvThumbs();
  for(const file of files){
    try{
      let f = file, type = file.type || '';
      if(!type && /\.pdf$/i.test(file.name)) type = 'application/pdf';
      if(!type && /\.mov$/i.test(file.name)) type = 'video/quicktime';
      if(!type && /\.mp4$/i.test(file.name)) type = 'video/mp4';
      if(type.startsWith('image/') && type !== 'image/gif' && (!IMG_OK.includes(type) || file.size > 3e6)){
        try{ f = await toJpeg(file); type = 'image/jpeg'; }catch(e){ if(!IMG_OK.includes(type)) throw new Error('unsupported'); }
      }
      if(!(IMG_OK.includes(type) || type.startsWith('video/') || type === 'application/pdf')) throw new Error('unsupported');
      if(f.size > 50 * 1024 * 1024) throw new Error('too_large');
      const path = await Files.upload(f, type);
      if(S.evDraft !== d){ Files.remove([path]); continue; }
      d.newIds.push(path);
      d.files.push({id:path, name: f.name || ('plik.' + type.split('/')[1]), type, size: f.size});
    }catch(e){
      const m = (e && e.message) || '';
      toast(/too_large|maximum allowed size|413/i.test(m) ? '„' + file.name + '” ma ponad 50 MB. Skróć nagranie albo dodaj zrzut ekranu.'
        : m === 'unsupported' ? 'Nieobsługiwany format: „' + file.name + '”. Dodaj zdjęcie, wideo lub PDF.'
        : 'Nie udało się wysłać „' + file.name + '”: ' + errMsg(e));
    }finally{
      if(S.evDraft === d){ d.uploading--; renderEvThumbs(); }
    }
  }
}

      const next = order[(order.indexOf(getTheme()) + 1) % order.length];
      const name = ({auto:'Tryb automatyczny', light:'Tryb dzienny', dark:'Tryb nocny'})[next];
      if(dlg.open || reducedMotion()){ applyTheme(next, true); toast(THEME_LABEL[next]); }
      else fxPlay(name, () => applyTheme(next, false));
      break;
    }
    case 'set-theme': applyTheme(b.dataset.themeOpt, true); break;
    case 'music': if(musicOn) musicStop(); else musicStart(); break;
    case 'lp-remove':
      if(!arm(b, 'Na pewno? Kliknij ponownie')) return;
      if(await run(() => DB.saveSettings({loginPhoto:null}))){ toast('Usunięto zdjęcie'); openSettings(); }
      break;
    case 'lucas': Lucas.cheer(); musicStart(); break;
    case 'close': dlgClose(); break;
    case 'reload': S.loadError = null; render(); loadAll(); break;
    case 'logout': dlgClose(); fxPlay('Sesja zakończona', () => sb.auth.signOut()); break;
    case 'new-ticket': openQuickTicket(b.dataset.prop || null); break;
    case 'quick-done': await saveQuickTicket(true); break;
    case 'open-ticket': if(id) openTicket(id); else dlgClose(); break;
    case 'edit-ticket': { const t = ticketById(S.detailId); if(t) openTicketForm(t); break; }
    case 'copy-ticket': { const t = ticketById(S.detailId); if(t) copyText(ticketText(t)); break; }
    case 'delete-ticket': {
      if(!arm(b, 'Usunąć na zawsze? Kliknij ponownie')) return;
      const tid = S.detailId;
      if(await run(() => DB.remove('tickets', tid))){
        S.evidence.forEach(x => { if(x.ticketId === tid) x.ticketId = null; });
        dlgClose(); render(); toast('Usunięto zgłoszenie');
      }
      break;
    }
    case 'delete-event': {
      if(!arm(b, 'Na pewno?')) return;
      const t = ticketById(S.detailId); if(!t) return;
      await run(() => DB.update('tickets', t.id, {events:(t.events || []).filter(x => x.id !== id)}));
      break;
    }
    case 'ping-template': insertPingTemplate(); break;
    case 'new-evidence': openEvidenceForm(null, b.dataset.ticket || null, b.dataset.prop || null); break;
    case 'open-evidence': openEvidence(id); break;
    case 'edit-evidence': { const ev = S.evidence.find(x => x.id === S.evidenceId); if(ev) openEvidenceForm(ev); break; }
    case 'delete-evidence': {
      if(!arm(b, 'Usunąć razem z plikami? Kliknij ponownie')) return;
      const ev = S.evidence.find(x => x.id === S.evidenceId); if(!ev) return;
      if(await run(() => DB.remove('evidence', ev.id))){
        Files.remove((ev.files || []).map(f => f.id));
        dlgClose(); toast('Usunięto dowód');
      }
      break;
    }
    case 'ev-cancel': { const back = S.evDraft && S.evDraft.returnTo; cleanupEvDraft(); if(back) openTicket(back); else dlgClose(); break; }
    case 'ev-remove-file': {
      const d = S.evDraft; if(!d) return;
      const f = d.files.splice(Number(b.dataset.i), 1)[0];
      if(f){
        if(d.newIds.includes(f.id)){ d.newIds = d.newIds.filter(x => x !== f.id); Files.remove([f.id]); }
        else d.removed.push(f.id);
      }
      renderEvThumbs(); break;
    }
    case 'edit-entry': openEntryForm(id); break;
    case 'delete-entry':
      if(!arm(b, 'Na pewno? Kliknij ponownie')) return;
      if(await run(() => DB.remove('journal', id))){ dlgClose(); toast('Usunięto wpis'); }
      break;
    case 'more-days': S.jf.limitDays += 40; render(); break;
    case 'jf-co': S.jf.company = b.dataset.v; S.listAnim = true; render(); break;
    case 'tf-status': S.tf.status = b.dataset.v; S.listAnim = true; render(); break;
    case 'ef-co': S.ef.company = b.dataset.v; S.listAnim = true; render(); break;
    case 'copy-journal': copyText(journalReport(journalFiltered())); break;
    case 'download-journal': saveFile('dziennik-' + todayStr() + '.md', journalReport(journalFiltered()), 'text/markdown;charset=utf-8'); break;
    case 'report-tickets': saveFile('raport-guestsage-' + todayStr() + '.md', ticketsReport(), 'text/markdown;charset=utf-8'); break;
    case 'copy-report': copyText(ticketsReport()); break;
    case 'csv-tickets': saveFile('zgloszenia-guestsage-' + todayStr() + '.csv', ticketsCsv(), 'text/csv;charset=utf-8'); break;
    case 'backup': saveFile('dziennik-guestsage-kopia-' + todayStr() + '.json', JSON.stringify({exportedAt:new Date().toISOString(), settings:S.settings, tickets:S.tickets, journal:S.journal, evidence:S.evidence, commissions:S.commissions}, null, 2), 'application/json'); break;
  }
});
document.addEventListener('submit', async e => {
  const f = e.target.closest('form[data-form]'); if(!f) return;
  e.preventDefault();
  const btn = f.querySelector('[type=submit]'); if(btn) btn.disabled = true;
  try{
    switch(f.dataset.form){
      case 'login': await doLogin(); break;
      case 'journal-quick': await submitJournalQuick(f); break;
      case 'journal-edit': {
        const id = f.dataset.id, text = ($('#jeText').value || '').trim();
        if(!text){ toast('Wpis nie może być pusty.'); break; }
        if(await run(() => DB.update('journal', id, {text, company:$('#jeCo').value, date:$('#jeDate').value || todayStr()}))){ dlgClose(); toast('Zapisano'); }
        break;
      }
      case 'ticket': await submitTicket(f); break;
      case 'quick-ticket': await saveQuickTicket(false); break;
      case 'mail': await submitMail(); break;
      case 'commission': await submitCommission(); break;
      case 'commission-edit': {
        const data = readCm('ce'); if(!data) break;
        if(await run(() => DB.update('commissions', f.dataset.id, data))){ S.cm.month = monthOf(data); S.cmSaved = null; dlgClose(); render(); toast('Zapisano zmiany'); }
        break;
      }
      case 'event': await submitEvent(); break;
      case 'evidence': await submitEvidence(); break;
      case 'settings': {
        const th = Math.max(1, Math.min(60, parseInt($('#sThreshold').value, 10) || 3));
        const sd = Math.max(1, Math.min(120, parseInt($('#sStale').value, 10) || 7));
        if(await run(() => DB.saveSettings({threshold:th, staleDays:sd}))){ toast('Zapisano progi'); dlgClose(); }
        break;
      }
    }
  } finally { if(btn && btn.isConnected && !(S.evDraft && S.evDraft.uploading)) btn.disabled = false; }
});
document.addEventListener('change', async e => {
  const el = e.target;
  if(el.dataset && el.dataset.coTarget){ syncCompany(el.name, el.dataset.coTarget); return; }
  if(el.id === 'evFiles'){ await uploadFiles(el.files); el.value = ''; return; }
  if(el.id === 'mTicket'){ setMailMode('existing'); return; }
  if(el.id === 'lpFile'){
    const f = el.files && el.files[0]; el.value = '';
    if(!f) return;
    let photo;
    try{ photo = await photoToDataUrl(f); }catch(e){ toast('Nie udało się odczytać zdjęcia. Wybierz JPG lub PNG.'); return; }
    if(await run(() => DB.saveSettings({loginPhoto:photo}))){ toast('Zapisano zdjęcie'); openSettings(); }
    return;
  }
  const c = el.dataset && el.dataset.change; if(!c) return;
  if(c === 'cm-month'){ S.cm.month = el.value; S.cmSaved = null; render(); return; }
  if(c === 'cm-name'){ if(await run(() => DB.saveSettings({commissionName:el.value.trim()}))) toast('Zapisano imię'); return; }
  if(c === 'tf-co'){ S.tf.company = el.value; S.listAnim = true; render(); }
  else if(c === 'tf-sort'){ S.tf.sort = el.value; S.listAnim = true; render(); }
  else if(c === 'jf-range'){ S.jf.range = el.value; S.jf.limitDays = 40; S.listAnim = true; render(); }
  else if(c === 'detail-status'){
    const t = ticketById(S.detailId); if(!t || el.value === t.status) return;
    const events = (t.events || []).concat([{id:uid(), at:nowLocal(), kind:'status', text:'Status: ' + STATUSES[el.value].label}]);
    if(await run(() => DB.update('tickets', t.id, {status:el.value, events, updatedAt:new Date().toISOString()}))) toast('Status: ' + STATUSES[el.value].label);
  }
});
document.addEventListener('input', e => {
  if(e.target.dataset && e.target.dataset.cm){ updateCmTotal(e.target.dataset.cm); return; }
  if(e.target.id === 'mText'){ clearTimeout(fillMail._t); fillMail._t = setTimeout(fillMail, 250); return; }
  const c = e.target.dataset && e.target.dataset.input; if(!c) return;
  if(c === 'tf-q') S.tf.q = e.target.value;
  else if(c === 'jf-q') S.jf.q = e.target.value;
  else if(c === 'ef-q') S.ef.q = e.target.value;
  else if(c === 'p-q') S.pq = e.target.value;
  render();
});
document.addEventListener('keydown', e => {
  if((e.key === 'Enter' || e.key === ' ') && e.target.classList && e.target.classList.contains('trow')){ e.preventDefault(); e.target.click(); return; }
  if(e.key === 'Enter' && (e.ctrlKey || e.metaKey) && e.target.tagName === 'TEXTAREA'){
    const f = e.target.closest('form[data-form]'); if(f){ e.preventDefault(); f.requestSubmit(); }
  }
});
document.addEventListener('paste', e => {
  // Pasting an e-mail anywhere on Pulpit/Zgłoszenia (outside a text field) opens "Zgłoszenie z maila".
  if(!S.evDraft && S.user && !dlg.open && (S.view === 'zgloszenia' || S.view === 'pulpit')){
    const tg = e.target, tag = tg && tg.tagName;
    const inField = tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || (tg && tg.isContentEditable);
    const text = e.clipboardData && e.clipboardData.getData('text/plain');
    if(!inField && text && text.trim().length >= 30){ e.preventDefault(); openMailImport(text); return; }
  }
  if(!S.evDraft) return;
  const files = Array.from((e.clipboardData && e.clipboardData.files) || []).filter(f => f.type.startsWith('image/'));
  if(files.length){ e.preventDefault(); uploadFiles(files); }
});
document.addEventListener('dragover', e => { const d = e.target.closest && e.target.closest('#evDrop'); if(d){ e.preventDefault(); d.classList.add('over'); } });
document.addEventListener('dragleave', e => { const d = e.target.closest && e.target.closest('#evDrop'); if(d) d.classList.remove('over'); });
document.addEventListener('drop', e => { const d = e.target.closest && e.target.closest('#evDrop'); if(d){ e.preventDefault(); d.classList.remove('over'); uploadFiles(e.dataTransfer.files); } });
window.addEventListener('hashchange', () => { const v = location.hash.slice(1); const hp = propFromHash(v); if(hp){ if(hp.id !== S.propId) openProp(hp.id); return; } if(RENDER[v] && v !== S.view) go(v); });
document.addEventListener('visibilitychange', () => {
  if(document.visibilityState !== 'visible' || !S.user) return;
  if(Date.now() - urlsAt > 10 * 3600e3){ URLS.clear(); urlsAt = Date.now(); }
  if(Date.now() - S.lastLoad > 60e3 && !dlg.open) loadAll();
});

/* ---------- auth ---------- */
async function doLogin(){
  const err = $('#lgErr'); err.hidden = true;
  if(!sb){ err.textContent = 'Panel nie jest jeszcze połączony z bazą. Uzupełnij config.js.'; err.hidden = false; return; }
  const email = $('#lgEmail').value.trim(), password = $('#lgPass').value;
  const {error} = await sb.auth.signInWithPassword({email, password});
  if(error){
    err.textContent = /invalid login|invalid credentials/i.test(error.message) ? 'Nieprawidłowy e-mail lub hasło.'
      : /email not confirmed/i.test(error.message) ? 'Konto nie jest potwierdzone. W Supabase zaznacz „Auto Confirm User”.'
      : errMsg(error);
    err.hidden = false;
  } else { $('#lgPass').value = ''; fxPlay('Dostęp przyznany'); }
}
function onSession(session){
  const user = session && session.user;
  if(user && (!S.user || S.user.id !== user.id)){
    S.user = user; S.ready = false; S.loadError = null;
    render();
    setTimeout(loadAll, 0);
  } else if(!user && S.user){
    S.user = null; S.ready = false; S.tickets = []; S.journal = []; S.evidence = []; S.commissions = []; S.cm.month = null; S.cmSaved = null; URLS.clear();
    dlgClose(); render();
  } else if(user) S.user = user;
}

/* ---------- login screen: flying Lucas + Macarena ---------- */
const MACARENA_ID = 'Z7EsuR5I8SE'; // Los Del Rio – Macarena, official audio (Los Del Rio – Topic / RCA Records)
let musicOn = false;
const Lucas = (() => {
  const wrap = $('#lucasWrap'), img = $('#lucas'), auth = $('#auth');
  let x = 24, y = 90, vx = 115, vy = 90, rot = 0, vr = 22, last = 0, raf = 0, running = false;
  function place(){ wrap.style.transform = 'translate3d(' + x.toFixed(1) + 'px,' + y.toFixed(1) + 'px,0)'; img.style.rotate = rot.toFixed(1) + 'deg'; }
  function bump(){
    vr = (Math.random() * 70 - 35) || 20;
    if(img.classList.contains('dance') || img.classList.contains('spin')) return;
    img.classList.remove('boing'); void img.offsetWidth; img.classList.add('boing');
  }
  function frame(t){
    if(!running) return;
    const dt = Math.min(0.05, last ? (t - last) / 1000 : 0); last = t;
    const W = auth.clientWidth, H = auth.clientHeight, s = wrap.offsetWidth || 100;
    const k = musicOn ? 1.9 : 1;
    x += vx * dt * k; y += vy * dt * k; rot += vr * dt * k;
    if(x < 0){ x = 0; vx = Math.abs(vx); bump(); }
    if(x > W - s){ x = Math.max(0, W - s); vx = -Math.abs(vx); bump(); }
    if(y < 0){ y = 0; vy = Math.abs(vy); bump(); }
    if(y > H - s){ y = Math.max(0, H - s); vy = -Math.abs(vy); bump(); }
    place();
    raf = requestAnimationFrame(frame);
  }
  return {
    start(){
      if(running) return;
      if(reducedMotion()){ x = 16; y = 72; rot = 0; place(); return; }
      running = true; last = 0; raf = requestAnimationFrame(frame);
    },
    stop(){ running = false; cancelAnimationFrame(raf); },
    cheer(){
      const b = $('#lucasBubble');
      b.hidden = false; clearTimeout(this._t); this._t = setTimeout(() => { b.hidden = true; }, 1800);
      img.classList.remove('boing', 'dance'); void img.offsetWidth; img.classList.add('spin');
      setTimeout(() => { img.classList.remove('spin'); if(musicOn) img.classList.add('dance'); }, 800);
      vx *= -1.15; vy *= 1.15;
      const cap = 260; vx = Math.max(-cap, Math.min(cap, vx)); vy = Math.max(-cap, Math.min(cap, vy));
    }
  };
})();
function updateMusicUI(){
  const btn = $('#musicBtn');
  btn.classList.toggle('on', musicOn);
  btn.querySelector('.lbl').textContent = musicOn ? 'Wyłącz muzykę' : 'Włącz Macarenę';
  $('#lucas').classList.toggle('dance', musicOn && !$('#lucas').classList.contains('spin'));
}
function musicStart(){
  if(musicOn) return;
  musicOn = true;
  const jb = $('#jukebox');
  jb.querySelector('.jb-frame').innerHTML = '<iframe src="https://www.youtube-nocookie.com/embed/' + MACARENA_ID +
    '?autoplay=1&playsinline=1&loop=1&playlist=' + MACARENA_ID + '&rel=0" title="Los Del Río – Macarena" allow="autoplay; encrypted-media; picture-in-picture" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>';
  jb.hidden = false;
  updateMusicUI();
}
function musicStop(){
  musicOn = false;
  const jb = $('#jukebox');
  jb.hidden = true; jb.querySelector('.jb-frame').innerHTML = '';
  updateMusicUI();
}
/* The photo lives only in the owner's private settings row; this device keeps a copy so the login screen can show it. */
function applyLoginPhoto(photo){
  const ok = typeof photo === 'string' && /^data:image\/(jpeg|png|webp);base64,/.test(photo);
  if(ok) lsSet('lucas', photo); else lsDel('lucas');
  showLucasFromCache();
}
function showLucasFromCache(){
  const photo = lsGet('lucas', '');
  const wrap = $('#lucasWrap'), img = $('#lucas');
  if(photo && /^data:image\//.test(photo)){ if(img.getAttribute('src') !== photo) img.src = photo; wrap.hidden = false; }
  else { wrap.hidden = true; img.removeAttribute('src'); }
}
async function photoToDataUrl(file){
  const url = URL.createObjectURL(file);
  try{
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
    const side = Math.min(img.naturalWidth, img.naturalHeight);
    const sx = (img.naturalWidth - side) / 2, sy = Math.max(0, (img.naturalHeight - side) / 2 - side * 0.08);
    const c = document.createElement('canvas'); c.width = c.height = 300;
    c.getContext('2d').drawImage(img, sx, sy, side, side, 0, 0, 300, 300);
    return c.toDataURL('image/jpeg', 0.85);
  } finally { URL.revokeObjectURL(url); }
}
function syncLoginFx(){
  if(!S.user && document.visibilityState === 'visible' && !$('#lucasWrap').hidden) Lucas.start(); else Lucas.stop();
  if(S.user && musicOn) musicStop();
}
document.addEventListener('visibilitychange', syncLoginFx);

/* ---------- theme ---------- */
const THEME_ICONS = {
  auto:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 000 16z" fill="currentColor"/></svg>',
  light:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
  dark:'<svg viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 019.5 4a8 8 0 1010.5 10.5z"/></svg>'
};
const THEME_LABEL = { auto:'Motyw: automatyczny', light:'Motyw: jasny', dark:'Motyw: ciemny' };
function getTheme(){ const t = lsGet('theme', 'auto'); return THEME_LABEL[t] ? t : 'auto'; }
function applyTheme(t, animate){
  const root = document.documentElement;
  if(animate && !reducedMotion()){
    root.classList.add('theme-anim');
    clearTimeout(applyTheme._t); applyTheme._t = setTimeout(() => root.classList.remove('theme-anim'), 500);
  }
  if(t === 'auto') root.removeAttribute('data-theme'); else root.setAttribute('data-theme', t);
  lsSet('theme', t);
  document.querySelectorAll('.theme-btn').forEach(b => { b.innerHTML = THEME_ICONS[t]; b.title = THEME_LABEL[t]; b.setAttribute('aria-label', THEME_LABEL[t] + '. Kliknij, aby zmienić.'); });
  document.querySelectorAll('[data-theme-opt]').forEach(b => b.classList.toggle('on', b.dataset.themeOpt === t));
}
if(window.matchMedia){
  const mq = matchMedia('(prefers-color-scheme: dark)');
  const onChange = () => { if(getTheme() === 'auto') applyTheme('auto', true); };
  if(mq.addEventListener) mq.addEventListener('change', onChange); else if(mq.addListener) mq.addListener(onChange);
}

function init(){
  applyTheme(getTheme(), false);
  showLucasFromCache();
  const h = location.hash.slice(1);
  S.view = RENDER[h] ? h : (RENDER[lsGet('view', '')] ? lsGet('view', '') : 'pulpit');
  const hp = propFromHash(h); if(hp){ S.view = 'obiekty'; S.propId = hp.id; }
  if(!sb){ $('#cfgNotice').hidden = false; render(); return; }
  sb.auth.onAuthStateChange((event, session) => { onSession(session); });
  sb.auth.getSession().then(({data}) => onSession(data && data.session));
  render();
}
init();
})();
