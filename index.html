<script>
(function(){
'use strict';

/* ---------- constants ---------- */
const COMPANIES = { GP:'Great Polonia', GG:'Great Greece', ALL:'Obie firmy' };
const CO_SHORT = { GP:'GP', GG:'GG', ALL:'GP+GG' };
const STATUSES = {
  wyslane:{label:'Wysłane', open:true},
  w_realizacji:{label:'W realizacji', open:true},
  czeka_na_mnie:{label:'Czekają na mnie', open:true},
  naprawione:{label:'Naprawione', open:false},
  odrzucone:{label:'Odrzucone / zbyte', open:false},
  zamkniete:{label:'Zamknięte', open:false}
};
const STATUS_LABELS = Object.fromEntries(Object.entries(STATUSES).map(([k, v]) => [k, v.label]));
const PRIORITIES = { niski:'Niski', sredni:'Średni', wysoki:'Wysoki', krytyczny:'Krytyczny' };
const PRIO_RANK = { krytyczny:0, wysoki:1, sredni:2, niski:3 };
const KINDS = {
  wyslane:'Wysłanie zgłoszenia',
  odpowiedz:'Odpowiedź GuestSage',
  ponaglenie:'Ponaglenie',
  notatka:'Notatka',
  status:'Zmiana statusu'
};
const CHANNELS = ['E-mail','Portal / system zgłoszeń','Czat','Telefon','Inne'];
const MODULES = ['Rezerwacje','Check-in online','Wiadomości do gości','Integracja z PMS','Płatności','Raporty','Ankiety / opinie','Aplikacja mobilna','Inne'];
const VIEWS = [
  {id:'pulpit', label:'Pulpit', icon:'<svg viewBox="0 0 24 24"><path d="M4 11l8-7 8 7v9h-5v-6H9v6H4z"/></svg>'},
  {id:'dziennik', label:'Dziennik', icon:'<svg viewBox="0 0 24 24"><path d="M6 3h11a2 2 0 012 2v16H8a2 2 0 01-2-2z"/><path d="M6 17a2 2 0 012-2h11M10 7h6M10 11h4"/></svg>'},
  {id:'zgloszenia', label:'Zgłoszenia', icon:'<svg viewBox="0 0 24 24"><path d="M4 7a2 2 0 002-2h12a2 2 0 002 2v2a3 3 0 000 6v2a2 2 0 00-2 2H6a2 2 0 00-2-2v-2a3 3 0 000-6z"/><path d="M10 5v14"/></svg>'},
  {id:'dowody', label:'Dowody', icon:'<svg viewBox="0 0 24 24"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>'}
];
const IC_FILE = '<svg viewBox="0 0 24 24"><path d="M7 3h7l5 5v13H7z"/><path d="M14 3v5h5"/></svg>';
const IC_VIDEO = '<svg viewBox="0 0 24 24"><rect x="3" y="6" width="13" height="12" rx="2"/><path d="M16 10l5-3v10l-5-3"/></svg>';
const IC_NOTE = '<svg viewBox="0 0 24 24"><path d="M5 4h14v16H5z"/><path d="M9 9h6M9 13h6M9 17h3"/></svg>';
const IMG_OK = ['image/png','image/jpeg','image/gif','image/webp'];
const BUCKET = 'dowody';
const BLANK = 'data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==';

/* ---------- state ---------- */
const S = {
  user:null, ready:false, loadError:null, lastLoad:0,
  tickets:[], journal:[], evidence:[], settings:{threshold:3, staleDays:7},
  view:'pulpit',
  tf:{status:'open', company:'all', q:'', sort:'silence'},
  jf:{company:'all', q:'', range:'30', limitDays:40},
  ef:{company:'all', q:''},
  detailId:null, evidenceId:null, evDraft:null, composerKind:'odpowiedz'
};
function lsGet(k, d){ try{ const v = localStorage.getItem('dgs:'+k); return v == null ? d : v; }catch(e){ return d; } }
function lsSet(k, v){ try{ localStorage.setItem('dgs:'+k, v); }catch(e){} }

/* ---------- helpers ---------- */
const $ = (s, r) => (r || document).querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2, '0');
const ymd = d => d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate());
const todayStr = () => ymd(new Date());
const nowLocal = () => { const d = new Date(); return ymd(d) + 'T' + pad(d.getHours()) + ':' + pad(d.getMinutes()); };
function parseLocal(s){
  if(!s) return null;
  const [d, t] = String(s).split('T');
  const [y, m, dd] = d.split('-').map(Number);
  const [h, mi] = (t || '00:00').split(':').map(Number);
  const r = new Date(y, (m||1)-1, dd||1, h||0, mi||0);
  return isNaN(r) ? null : r;
}
function daysSince(s){
  const d = parseLocal(s); if(!d) return null;
  const a = new Date(); a.setHours(0,0,0,0);
  const b = new Date(d); b.setHours(0,0,0,0);
  return Math.round((a - b) / 864e5);
}
function daysBetween(a, b){
  const x = parseLocal(a), y = parseLocal(b); if(!x || !y) return null;
  x.setHours(0,0,0,0); y.setHours(0,0,0,0);
  return Math.round((y - x) / 864e5);
}
function fmtDate(s){
  const d = parseLocal(s); if(!d) return '—';
  const o = {day:'numeric', month:'short'};
  if(d.getFullYear() !== new Date().getFullYear()) o.year = 'numeric';
  return d.toLocaleDateString('pl-PL', o);
}
function fmtDateTime(s){
  const d = parseLocal(s); if(!d) return '—';
  return fmtDate(s) + (String(s).includes('T') ? ', ' + pad(d.getHours()) + ':' + pad(d.getMinutes()) : '');
}
const fmtLong = s => { const d = parseLocal(s); return d ? d.toLocaleDateString('pl-PL', {weekday:'long', day:'numeric', month:'long', year: d.getFullYear() !== new Date().getFullYear() ? 'numeric' : undefined}) : '—'; };
function plDays(n){ return n === 1 ? '1 dzień' : n + ' dni'; }
function plural(n, one, few, many){
  const m10 = n % 10, m100 = n % 100;
  if(n === 1) return one;
  if(m10 >= 2 && m10 <= 4 && (m100 < 12 || m100 > 14)) return few;
  return many;
}
const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
const uuid = () => (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : uid() + uid();
const tnum = t => 'GS-' + String(t.num || 0).padStart(3, '0');
const chip = c => '<span class="chip ' + esc(c || 'ALL') + '">' + esc(CO_SHORT[c] || 'GP+GG') + '</span>';
const coMatch = (c, f) => f === 'all' || c === f || c === 'ALL';
function startOfWeek(d){ const x = new Date(d); x.setHours(0,0,0,0); x.setDate(x.getDate() - ((x.getDay() + 6) % 7)); return x; }
function opts(map, sel){ return Object.entries(map).map(([v, l]) => '<option value="' + v + '"' + (v === sel ? ' selected' : '') + '>' + esc(l) + '</option>').join(''); }

function toast(msg){
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), 2800);
}
async function copyText(text){
  try{ await navigator.clipboard.writeText(text); toast('Skopiowano do schowka'); return true; }
  catch(e){
    const ta = document.createElement('textarea'); ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    let ok = false; try{ ok = document.execCommand('copy'); }catch(_){}
    ta.remove();
    toast(ok ? 'Skopiowano do schowka' : 'Nie udało się skopiować — zaznacz tekst ręcznie');
    return ok;
  }
}
function saveFile(filename, data, mime){
  const blob = new Blob([data], {type: mime || 'text/plain;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 5000);
}
function arm(btn, label){
  if(btn.dataset.armed === '1') return true;
  const orig = btn.textContent;
  btn.dataset.armed = '1'; btn.classList.add('armed'); btn.textContent = label || 'Na pewno? Kliknij ponownie';
  setTimeout(() => { if(btn.isConnected){ btn.dataset.armed = ''; btn.classList.remove('armed'); btn.textContent = orig; } }, 4000);
  return false;
}

/* ---------- Supabase data layer ---------- */
const CFG = window.DGS_CONFIG || {};
const configured = !!(CFG.supabaseUrl && CFG.supabaseKey && /^https:\/\//.test(CFG.supabaseUrl) && !/WKLEJ/.test(CFG.supabaseUrl + CFG.supabaseKey));
const sb = (configured && window.supabase) ? window.supabase.createClient(CFG.supabaseUrl, CFG.supabaseKey, {auth:{persistSession:true, autoRefreshToken:true, detectSessionInUrl:false}}) : null;

const camel = k => k.replace(/_([a-z])/g, (_, c) => c.toUpperCase());
const snake = k => k.replace(/[A-Z]/g, c => '_' + c.toLowerCase());
function fromRow(r){ const o = {}; for(const k in r) o[camel(k)] = r[k]; return o; }
function toRow(o){ const r = {}; for(const k in o){ if(k === 'id' || k === 'userId') continue; r[snake(k)] = o[k]; } return r; }
const STORE = { tickets:'tickets', journal:'journal', evidence:'evidence' };

function errMsg(e){
  const m = (e && (e.message || e.error_description || e.error)) || '';
  if(/Failed to fetch|NetworkError|Load failed/i.test(m)) return 'Brak połączenia z internetem.';
  if(/JWT|not authenticated|401/i.test(m)) return 'Sesja wygasła. Zaloguj się ponownie.';
  if(/row-level security|permission denied/i.test(m)) return 'Brak uprawnień do zapisu. Sprawdź, czy schemat SQL został uruchomiony.';
  return m || 'nieznany błąd';
}
async function run(fn){
  try{ await fn(); return true; }
  catch(e){ console.error(e); toast('Nie udało się zapisać: ' + errMsg(e)); return false; }
}
function upsertLocal(table, row){
  const arr = S[STORE[table]];
  const i = arr.findIndex(x => x.id === row.id);
  if(i >= 0) arr[i] = row; else arr.push(row);
}
const DB = {
  async fetchAll(table){
    const out = [];
    for(let from = 0; ; from += 1000){
      const {data, error} = await sb.from(table).select('*').range(from, from + 999);
      if(error) throw error;
      out.push(...data.map(fromRow));
      if(data.length < 1000) break;
    }
    return out;
  },
  async insert(table, obj){
    const {data, error} = await sb.from(table).insert(toRow(obj)).select().single();
    if(error) throw error;
    const row = fromRow(data); upsertLocal(table, row); render(); return row;
  },
  async update(table, id, obj){
    const {data, error} = await sb.from(table).update(toRow(obj)).eq('id', id).select().single();
    if(error) throw error;
    const row = fromRow(data); upsertLocal(table, row); render(); return row;
  },
  async remove(table, id){
    const {error} = await sb.from(table).delete().eq('id', id);
    if(error) throw error;
    S[STORE[table]] = S[STORE[table]].filter(x => x.id !== id); render();
  },
  async saveSettings(s){
    const {error} = await sb.from('settings').upsert({user_id:S.user.id, threshold:s.threshold, stale_days:s.staleDays});
    if(error) throw error;
    S.settings = s; render();
  }
};
async function loadAll(){
  try{
    const [t, j, e, s] = await Promise.all([
      DB.fetchAll('tickets'), DB.fetchAll('journal'), DB.fetchAll('evidence'),
      sb.from('settings').select('*').maybeSingle()
    ]);
    if(s.error) throw s.error;
    S.tickets = t; S.journal = j; S.evidence = e;
    if(s.data) S.settings = {threshold:s.data.threshold || 3, staleDays:s.data.stale_days || 7};
    if(!S.ready) S.enter = true;
    S.ready = true; S.loadError = null; S.lastLoad = Date.now();
  }catch(err){
    console.error(err);
    S.loadError = errMsg(err);
  }
  render();
}

/* Files in Supabase Storage (private bucket, signed URLs) */
const URLS = new Map();
let urlsAt = Date.now();
const URLQ = new Set(), PENDING = new Set();
let urlTimer = null;
function mediaAttr(path, attr){
  const u = URLS.get(path);
  return attr + '="' + esc(u || (attr === 'src' ? BLANK : '#')) + '" data-path="' + esc(path) + '" data-attr="' + attr + '"';
}
function patchUrls(){
  document.querySelectorAll('[data-path]').forEach(el => {
    const p = el.dataset.path, u = URLS.get(p);
    if(u){ if(el.getAttribute(el.dataset.attr) !== u) el.setAttribute(el.dataset.attr, u); }
    else if(!URLS.has(p) && !PENDING.has(p)) URLQ.add(p);
  });
  if(URLQ.size && !urlTimer) urlTimer = setTimeout(flushUrls, 0);
}
async function flushUrls(){
  urlTimer = null;
  const paths = Array.from(URLQ); URLQ.clear();
  if(!paths.length || !sb) return;
  paths.forEach(p => PENDING.add(p));
  try{
    const {data, error} = await sb.storage.from(BUCKET).createSignedUrls(paths, 60 * 60 * 12);
    if(error) throw error;
    (data || []).forEach(r => URLS.set(r.path, r.signedUrl || ''));
  }catch(e){ console.error(e); }
  paths.forEach(p => { PENDING.delete(p); if(!URLS.has(p)) URLS.set(p, ''); });
  patchUrls();
}
const Files = {
  async upload(file, type){
    const ext = ({'image/jpeg':'jpg','image/png':'png','image/gif':'gif','image/webp':'webp','application/pdf':'pdf','video/mp4':'mp4','video/quicktime':'mov','video/webm':'webm'})[type]
      || ((file.name || '').split('.').pop() || 'bin').toLowerCase().replace(/[^a-z0-9]/g, '').slice(0, 6) || 'bin';
    const path = S.user.id + '/' + uuid() + '.' + ext;
    const {error} = await sb.storage.from(BUCKET).upload(path, file, {contentType:type, cacheControl:'3600', upsert:false});
    if(error) throw error;
    try{ URLS.set(path, URL.createObjectURL(file)); }catch(e){}
    return path;
  },
  async remove(paths){
    paths = (paths || []).filter(Boolean);
    if(!paths.length) return;
    const {error} = await sb.storage.from(BUCKET).remove(paths);
    if(error) console.error(error);
  }
};

/* ---------- ticket logic ---------- */
const isOpen = t => !!(STATUSES[t.status] || STATUSES.wyslane).open;
function sortedEvents(t){ return (t.events || []).slice().sort((a, b) => (a.at || '') < (b.at || '') ? -1 : (a.at || '') > (b.at || '') ? 1 : 0); }
function silence(t){
  if(!isOpen(t) || t.status === 'czeka_na_mnie') return null;
  const ev = sortedEvents(t);
  let lastOut = null, lastIn = null;
  for(const e of ev){
    if(e.kind === 'wyslane' || e.kind === 'ponaglenie') lastOut = e.at;
    if(e.kind === 'odpowiedz') lastIn = e.at;
  }
  if(!lastOut) lastOut = t.sentAt;
  if(!lastOut || (lastIn && lastIn >= lastOut)) return null;
  const days = daysSince(lastOut);
  const pings = ev.filter(e => e.kind === 'ponaglenie' && (!lastIn || e.at > lastIn)).length;
  return {days, since:lastOut, pings, overdue: days >= S.settings.threshold};
}
function lastActivity(t){ const ev = sortedEvents(t); return ev.length ? ev[ev.length-1].at : t.sentAt; }
function isStale(t){
  if(!isOpen(t)) return false;
  const s = silence(t); if(s && s.overdue) return false;
  const d = daysSince(lastActivity(t));
  return d != null && d >= S.settings.staleDays;
}
function firstResponseDays(t){
  const ev = sortedEvents(t);
  const out = (ev.find(e => e.kind === 'wyslane') || {}).at || t.sentAt;
  const resp = ev.find(e => e.kind === 'odpowiedz');
  if(!out || !resp) return null;
  const a = parseLocal(out), b = parseLocal(resp.at);
  if(!a || !b) return null;
  return Math.max(0, (b - a) / 864e5);
}
function gsStats(){
  const all = S.tickets;
  const resp = all.map(firstResponseDays).filter(v => v != null);
  const never = all.filter(t => !(t.events || []).some(e => e.kind === 'odpowiedz') && (daysSince(t.sentAt) || 0) >= S.settings.threshold);
  const fixed = all.filter(t => t.status === 'naprawione').length;
  const rejected = all.filter(t => t.status === 'odrzucone').length;
  const pings = all.reduce((n, t) => n + (t.events || []).filter(e => e.kind === 'ponaglenie').length, 0);
  return {
    total: all.length, fixed, rejected, pings, never: never.length,
    avgResp: resp.length ? resp.reduce((a, b) => a + b, 0) / resp.length : null,
    fixRate: all.length ? Math.round(fixed / all.length * 100) : null
  };
}
function silenceBadge(t){
  const s = silence(t);
  if(s && s.overdue) return '<span class="badge danger">Cisza ' + plDays(s.days) + (s.pings ? ' · ' + s.pings + '× ponaglone' : '') + '</span>';
  if(s) return '<span class="badge">' + (s.days <= 0 ? 'Wysłane dziś' : 'Czeka ' + plDays(s.days)) + '</span>';
  if(t.status === 'czeka_na_mnie') return '<span class="badge you">Twój ruch</span>';
  if(isStale(t)) return '<span class="badge warn">Bez postępu ' + plDays(daysSince(lastActivity(t))) + '</span>';
  return '';
}
function ticketRow(t){
  const st = STATUSES[t.status] || STATUSES.wyslane;
  const prio = (t.priority === 'krytyczny' || t.priority === 'wysoki') ? '<span class="prio p-' + t.priority + '">' + PRIORITIES[t.priority] + '</span>' : '';
  return '<button type="button" class="trow" data-action="open-ticket" data-id="' + esc(t.id) + '">' +
    '<span class="tnum">' + tnum(t) + '</span>' +
    '<span class="tmain"><span class="ttitle">' + esc(t.title) + '</span>' +
    '<span class="tmeta">' + chip(t.company) + '<span class="pill st-' + esc(t.status) + '">' + st.label + '</span>' + prio +
    (t.module ? '<span>' + esc(t.module) + '</span>' : '') +
    '<span>wysł. ' + fmtDate(t.sentAt) + '</span>' +
    (t.gsRef ? '<span class="mono">nr ' + esc(t.gsRef) + '</span>' : '') + '</span></span>' +
    '<span class="tside">' + silenceBadge(t) + '</span></button>';
}

/* ---------- views ---------- */
function headHTML(title, sub, actions){
  return '<div class="page-head"><div>' + (sub ? '<p class="eyebrow">' + sub + '</p>' : '') + '<h1>' + title + '</h1></div><div class="actions">' + (actions || '') + '</div></div>';
}
function quickAddHTML(prefix, compact){
  const co = lsGet('lastCo', 'GP');
  const radios = ['GP','GG','ALL'].map(c =>
    '<label><input type="radio" name="' + prefix + 'Co" id="' + prefix + 'Co' + c + '" value="' + c + '"' + (co === c ? ' checked' : '') + '><span>' + CO_SHORT[c] + '</span></label>').join('');

function journalFiltered(){
  const f = S.jf, q = f.q.trim().toLowerCase();
  const now = new Date(); now.setHours(0,0,0,0);
  const sow = startOfWeek(now), psow = new Date(sow); psow.setDate(psow.getDate() - 7);
  return S.journal.filter(j => {
    if(!coMatch(j.company, f.company)) return false;
    if(q && !String(j.text || '').toLowerCase().includes(q)) return false;
    const d = parseLocal(j.date); if(!d) return f.range === 'all';
    switch(f.range){
      case 'week': return d >= sow;
      case 'lastweek': return d >= psow && d < sow;
      case 'month': return d.getFullYear() === now.getFullYear() && d.getMonth() === now.getMonth();
      case '30': return (now - d) / 864e5 < 30;
      default: return true;
    }
  });
}
function groupByDate(list){
  const m = new Map();
  list.slice().sort((a, b) => a.date === b.date ? ((a.createdAt || '') < (b.createdAt || '') ? -1 : 1) : (a.date < b.date ? 1 : -1))
    .forEach(j => { if(!m.has(j.date)) m.set(j.date, []); m.get(j.date).push(j); });
  return m;
}

function ticketFiltered(){
  const f = S.tf, q = f.q.trim().toLowerCase();
  const list = S.tickets.filter(t => {
    if(!coMatch(t.company, f.company)) return false;
    if(f.status === 'open' && !isOpen(t)) return false;
    if(f.status === 'closed' && isOpen(t)) return false;
    if(f.status === 'silent'){ const s = silence(t); if(!(s && s.overdue)) return false; }
    if(q){
      const hay = [tnum(t), t.title, t.gsRef, t.module, t.description, t.impact].join(' ').toLowerCase();
      if(!hay.includes(q)) return false;
    }
    return true;
  });
  const sil = t => { const s = silence(t); return s ? s.days + (s.overdue ? 1000 : 0) : (isStale(t) ? 500 : -1); };
  if(f.sort === 'silence') list.sort((a, b) => sil(b) - sil(a) || ((a.sentAt || '') < (b.sentAt || '') ? 1 : -1));
  else if(f.sort === 'prio') list.sort((a, b) => (PRIO_RANK[a.priority] ?? 9) - (PRIO_RANK[b.priority] ?? 9) || ((a.sentAt || '') < (b.sentAt || '') ? 1 : -1));
  else list.sort((a, b) => (a.sentAt || '') < (b.sentAt || '') ? 1 : (a.sentAt || '') > (b.sentAt || '') ? -1 : (b.num || 0) - (a.num || 0));
  return list;
}

function withPreserved(root, fn){
  const vals = {};
  root.querySelectorAll('input[id],textarea[id],select[id]').forEach(el => {
    vals[el.id] = (el.type === 'checkbox' || el.type === 'radio') ? {c:el.checked} : {v:el.value};
  });
  const a = document.activeElement;
  const aid = a && root.contains(a) && a.id ? a.id : null;
  let sel = null;
  if(aid){ try{ sel = [a.selectionStart, a.selectionEnd]; }catch(e){} }
  fn();
  for(const id in vals){
    const el = document.getElementById(id);
    if(!el || !root.contains(el)) continue;
    if('c' in vals[id]) el.checked = vals[id].c; else el.value = vals[id].v;
  }
  if(aid){
    const el = document.getElementById(aid);
    if(el){ el.focus({preventScroll:true}); if(sel && sel[0] != null){ try{ el.setSelectionRange(sel[0], sel[1]); }catch(e){} } }
  }
}

}

const reducedMotion = () => window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
function countUp(root){
  if(reducedMotion()) return;
  root.querySelectorAll('.stat .v, .fact .v').forEach(el => {
    const m = el.textContent.match(/^(\d+)(%?)$/); if(!m) return;
    const target = +m[1], suffix = m[2]; if(target < 2) return;
    const t0 = performance.now(), dur = 750;
    const step = now => {
      const p = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - p, 3);
      el.textContent = Math.round(target * e) + suffix;
      if(p < 1 && el.isConnected) requestAnimationFrame(step);
    };
    el.textContent = '0' + suffix; requestAnimationFrame(step);
  });
}
const SKELETON = '<div class="skeleton"><div class="sk" style="height:58px;width:min(340px,70%)"></div><div class="stats">' +
  '<div class="sk" style="height:104px"></div>'.repeat(4) + '</div><div class="sk" style="height:240px"></div></div>';

  renderNav();
  document.querySelectorAll('.view').forEach(v => { v.hidden = v.id !== 'v-' + S.view; });
  const root = document.getElementById('v-' + S.view);
  if(!S.ready){
    root.classList.remove('enter');
    root.innerHTML = S.loadError
      ? '<div class="panel"><div class="empty"><strong>Nie udało się wczytać danych</strong><p>' + esc(S.loadError) + '</p><button class="btn" type="button" data-action="reload">Spróbuj ponownie</button></div></div>'
      : SKELETON;
    return;
  }
  withPreserved(root, () => { root.innerHTML = RENDER[S.view](); });
  if(S.enter){
    root.classList.remove('enter'); void root.offsetWidth; root.classList.add('enter');
    S.enter = false; countUp(root);
  } else root.classList.remove('enter');
  if(S.detailId && dlg.open) refreshDetail();
  patchUrls();
}

function go(view){
  if(!RENDER[view]) view = 'pulpit';
  if(view !== S.view) S.enter = true;
  S.view = view; lsSet('view', view);
  if(location.hash.slice(1) !== view){ try{ history.replaceState(null, '', '#' + view); }catch(e){} }
  render(); window.scrollTo(0, 0);
}

async function toJpeg(file){
  const url = URL.createObjectURL(file);
  try{
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
    const max = 2400; let w = img.naturalWidth, h = img.naturalHeight;
    const sc = Math.min(1, max / Math.max(w, h)); w = Math.round(w * sc); h = Math.round(h * sc);
    const c = document.createElement('canvas'); c.width = w; c.height = h;
    c.getContext('2d').drawImage(img, 0, 0, w, h);
    const blob = await new Promise(r => c.toBlob(r, 'image/jpeg', 0.85));
    if(!blob) throw new Error('encode');
    return new File([blob], (file.name || 'zrzut').replace(/\.[^.]+$/, '') + '.jpg', {type:'image/jpeg'});
  } finally { URL.revokeObjectURL(url); }
}
async function uploadFiles(fileList){
  const d = S.evDraft; if(!d) return;
  const files = Array.from(fileList || []); if(!files.length) return;
  d.uploading += files.length; renderEvThumbs();
  for(const file of files){
    try{
      let f = file, type = file.type || '';
      if(!type && /\.pdf$/i.test(file.name)) type = 'application/pdf';
      if(!type && /\.mov$/i.test(file.name)) type = 'video/quicktime';
      if(!type && /\.mp4$/i.test(file.name)) type = 'video/mp4';
      if(type.startsWith('image/') && type !== 'image/gif' && (!IMG_OK.includes(type) || file.size > 3e6)){
        try{ f = await toJpeg(file); type = 'image/jpeg'; }catch(e){ if(!IMG_OK.includes(type)) throw new Error('unsupported'); }
      }
      if(!(IMG_OK.includes(type) || type.startsWith('video/') || type === 'application/pdf')) throw new Error('unsupported');
      if(f.size > 50 * 1024 * 1024) throw new Error('too_large');
      const path = await Files.upload(f, type);
      if(S.evDraft !== d){ Files.remove([path]); continue; }
      d.newIds.push(path);
      d.files.push({id:path, name: f.name || ('plik.' + type.split('/')[1]), type, size: f.size});
    }catch(e){
      const m = (e && e.message) || '';
      toast(/too_large|maximum allowed size|413/i.test(m) ? '„' + file.name + '” ma ponad 50 MB. Skróć nagranie albo dodaj zrzut ekranu.'
        : m === 'unsupported' ? 'Nieobsługiwany format: „' + file.name + '”. Dodaj zdjęcie, wideo lub PDF.'
        : 'Nie udało się wysłać „' + file.name + '”: ' + errMsg(e));
    }finally{
      if(S.evDraft === d){ d.uploading--; renderEvThumbs(); }
    }
  }
}

function openEvidence(id){
  const e = S.evidence.find(x => x.id === id); if(!e) return;
  S.detailId = null;
  S.evidenceId = id;
  const t = e.ticketId ? ticketById(e.ticketId) : null;

    if(String(f.type).startsWith('image/')) return '<a ' + mediaAttr(f.id, 'href') + ' target="_blank" rel="noopener"><img ' + mediaAttr(f.id, 'src') + ' alt="' + esc(f.name) + '" loading="lazy"></a>';
    if(String(f.type).startsWith('video/')) return '<video ' + mediaAttr(f.id, 'src') + ' controls playsinline preload="metadata"></video>';
    return '<a class="filelink" ' + mediaAttr(f.id, 'href') + ' target="_blank" rel="noopener">' + IC_FILE + esc(f.name) + '</a>';
  }).join('');
  dlgOpen('<div class="dlg-head"><div><p class="eyebrow">Dowód · ' + esc(fmtLong(e.date)) + '</p><h2>' + esc(e.title) + '</h2>' +
    '<div class="tmeta" style="margin-top:6px">' + chip(e.company) + (t ? '<button class="link" type="button" data-action="open-ticket" data-id="' + esc(t.id) + '"><span class="mono">' + tnum(t) + '</span> · ' + esc(t.title) + '</button>' : '<span>bez przypiętego zgłoszenia</span>') + '</div></div>' + closeBtn + '</div>' +
    '<div class="dlg-scroll">' + (e.description ? '<p class="prose">' + esc(e.description) + '</p>' : '') +
    (media ? '<div class="media">' + media + '</div>' : '<p class="muted">Bez plików.</p>') + '</div>' +
    '<div class="dlg-foot"><button class="btn danger left" type="button" data-action="delete-evidence">Usuń dowód</button><button class="btn ghost" type="button" data-action="edit-evidence">Edytuj</button></div>',
    {wide:true, soft:true});
}

/* ---------- journal ---------- */
async function submitJournalQuick(form){
  const p = form.dataset.prefix;
  const ta = $('#' + p + 'Text');
  const text = (ta.value || '').trim();
  if(!text){ ta.focus(); return; }
  const company = (form.querySelector('input[name="' + p + 'Co"]:checked') || {}).value || 'GP';
  const date = $('#' + p + 'Date').value || todayStr();
  lsSet('lastCo', company);
  ta.value = '';
  let row = null;
  const ok = await run(async () => { row = await DB.insert('journal', {text, company, date}); });
  if(ok){
    toast('Zapisano w dzienniku');
    S.flashId = row.id; render();
    setTimeout(() => { if(S.flashId === row.id) S.flashId = null; }, 1500);
  }
  else { const t2 = $('#' + p + 'Text'); if(t2) t2.value = text; }
}
function openEntryForm(id){
  const j = S.journal.find(x => x.id === id); if(!j) return;
  dlgOpen('<form data-form="journal-edit" data-id="' + esc(j.id) + '" style="display:contents"><div class="dlg-head"><div><p class="eyebrow">Wpis z ' + esc(fmtLong(j.date)) + '</p><h2>Edycja wpisu</h2></div>' + closeBtn + '</div>' +
    '<div class="dlg-scroll"><label class="field"><span>Treść</span><textarea id="jeText" rows="6">' + esc(j.text) + '</textarea></label>' +
    '<div class="frow"><label class="field"><span>Firma</span><select id="jeCo">' + opts(COMPANIES, j.company) + '</select></label>' +
    '<label class="field"><span>Data</span><input type="date" id="jeDate" value="' + esc(j.date) + '"></label></div></div>' +
    '<div class="dlg-foot"><button class="btn danger left" type="button" data-action="delete-entry" data-id="' + esc(j.id) + '">Usuń wpis</button><button class="btn ghost" type="button" data-action="close">Anuluj</button><button class="btn" type="submit">Zapisz</button></div></form>');
}
function journalReport(list){
  const groups = groupByDate(list);
  const rangeLabel = ({week:'ten tydzień', lastweek:'poprzedni tydzień', month:'ten miesiąc', '30':'ostatnie 30 dni', all:'cały okres'})[S.jf.range];
  let s = '# Dziennik pracy — ' + rangeLabel + (S.jf.company !== 'all' ? ' (' + COMPANIES[S.jf.company] + ')' : '') + '\n';
  const dates = Array.from(groups.keys()).reverse();
  for(const d of dates){
    s += '\n## ' + fmtLong(d) + '\n';
    for(const j of groups.get(d)) s += '- [' + CO_SHORT[j.company] + '] ' + String(j.text).replace(/\n+/g, ' ') + '\n';
  }
  return s;
}

/* ---------- reports / exports ---------- */
function ticketsReport(){
  const st = gsStats();
  const list = S.tickets.slice().sort((a, b) => (a.num || 0) - (b.num || 0));
  const openSilent = S.tickets.filter(t => { const s = silence(t); return s && s.overdue; });
  let s = '# Raport zgłoszeń do GuestSage\n\nWygenerowano: ' + fmtLong(todayStr()) + '\n\n## Podsumowanie\n' +
    '- Wszystkich zgłoszeń: ' + st.total + '\n' +
    '- Otwartych: ' + S.tickets.filter(isOpen).length + ', w tym bez odpowiedzi od co najmniej ' + plDays(S.settings.threshold) + ': ' + openSilent.length + '\n' +
    '- Naprawionych: ' + st.fixed + (st.fixRate != null ? ' (' + st.fixRate + '%)' : '') + '\n' +
    '- Odrzuconych / zbytych: ' + st.rejected + '\n' +
    '- Zgłoszeń bez żadnej odpowiedzi: ' + st.never + '\n' +
    '- Średni czas pierwszej odpowiedzi: ' + (st.avgResp == null ? 'brak danych' : st.avgResp.toLocaleString('pl-PL', {maximumFractionDigits:1}) + ' dnia') + '\n' +
    '- Wysłanych ponagleń: ' + st.pings + '\n' +
    '- Zebranych dowodów: ' + S.evidence.length + '\n\n## Zgłoszenia\n';
  for(const t of list) s += '\n### ' + ticketText(t).replace(/^([^\n]*)\n/, '$1\n\n');
  return s;
}
function csvCell(v){ v = v == null ? '' : String(v); return /[",\n;]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; }
function ticketsCsv(){
  const head = ['Nr','Temat','Firma','Moduł','Priorytet','Status','Nr GuestSage','Kanał','Wysłane','Dni otwarte','Dni bez odpowiedzi','Ponaglenia','Pierwsza odpowiedź po (dni)','Dowody','Opis','Wpływ'];
  const rows = S.tickets.slice().sort((a, b) => (a.num || 0) - (b.num || 0)).map(t => {
    const s = silence(t), fr = firstResponseDays(t);
    return [tnum(t), t.title, COMPANIES[t.company], t.module, PRIORITIES[t.priority], (STATUSES[t.status] || {}).label, t.gsRef, t.channel, t.sentAt,
      isOpen(t) ? daysSince(t.sentAt) : '', s ? s.days : '', (t.events || []).filter(e => e.kind === 'ponaglenie').length,
      fr == null ? '' : fr.toFixed(1).replace('.', ','), S.evidence.filter(e => e.ticketId === t.id).length, t.description, t.impact];
  });
  return '﻿' + [head].concat(rows).map(r => r.map(csvCell).join(';')).join('\r\n');
}
function openSettings(){
  dlgOpen('<form data-form="settings" style="display:contents"><div class="dlg-head"><div><p class="eyebrow">Ustawienia</p><h2>Progi, eksport i konto</h2></div>' + closeBtn + '</div>' +
    '<div class="dlg-scroll">' +
    '<div class="block"><h3>Kiedy uznać, że Cię olewają</h3><div class="frow">' +
    '<label class="field"><span>„Bez odpowiedzi” po ilu dniach ciszy</span><input type="number" id="sThreshold" min="1" max="60" value="' + S.settings.threshold + '"></label>' +
    '<label class="field"><span>„Bez postępu” po ilu dniach</span><input type="number" id="sStale" min="1" max="120" value="' + S.settings.staleDays + '"><small>Dla zgłoszeń, na które odpisali, ale dalej nic się nie dzieje.</small></label>' +
    '</div><div class="actions" style="margin-top:10px"><button class="btn" type="submit">Zapisz progi</button></div></div>' +
    '<div class="block"><h3>Eksport</h3><div class="list-plain">' +
    '<div class="actions"><button class="btn ghost" type="button" data-action="report-tickets">Raport zgłoszeń (.md)</button><button class="btn ghost" type="button" data-action="copy-report">Kopiuj raport</button></div>' +
    '<div class="actions"><button class="btn ghost" type="button" data-action="csv-tickets">Tabela zgłoszeń (.csv, Excel)</button><button class="btn ghost" type="button" data-action="backup">Kopia zapasowa (.json)</button></div>' +
    '<small class="muted">Kopia zapasowa zawiera wszystkie wpisy, zgłoszenia i opisy dowodów. Same pliki zostają w Supabase. Rób ją raz w miesiącu.</small></div></div>' +
    '<div class="block"><h3>Wygląd</h3><div class="seg theme-opts" role="radiogroup" aria-label="Motyw">' +
      [['auto','Automatyczny'],['light','Jasny'],['dark','Ciemny']].map(([v, l]) =>
        '<button type="button" data-action="set-theme" data-theme-opt="' + v + '" class="' + (getTheme() === v ? 'on' : '') + '">' + l + '</button>').join('') +
      '</div><small class="muted" style="display:block;margin-top:6px">Automatyczny przełącza się razem z ustawieniem telefonu lub komputera.</small></div>' +
    '<div class="block"><h3>Konto</h3><p class="muted" style="margin-bottom:8px">Zalogowano jako <strong>' + esc(S.user && S.user.email) + '</strong></p>' +
    '<button class="btn ghost" type="button" data-action="logout">Wyloguj się</button></div>' +
    '<div class="block"><h3>Jak dodać do iPhone’a</h3><ol style="margin:0;padding-left:20px;display:grid;gap:4px">' +
    '<li>Otwórz adres panelu w Safari i zaloguj się.</li>' +
    '<li>Stuknij Udostępnij, a potem „Do ekranu początkowego”.</li>' +
    '<li>Panel otwiera się jak aplikacja i pamięta logowanie.</li></ol></div>' +
    '</div></form>');
}

/* ---------- events ---------- */
document.addEventListener('click', async e => {
  const b = e.target.closest('[data-action]'); if(!b) return;
  const a = b.dataset.action, id = b.dataset.id;
  switch(a){
    case 'goto': dlgClose(); go(b.dataset.view); break;
    case 'goto-tickets': S.tf.status = b.dataset.filter; go('zgloszenia'); break;
    case 'settings': openSettings(); break;
    case 'theme': {
      const order = ['auto', 'light', 'dark'];
      const next = order[(order.indexOf(getTheme()) + 1) % order.length];
      applyTheme(next, true); toast(THEME_LABEL[next]); break;
    }
    case 'set-theme': applyTheme(b.dataset.themeOpt, true); break;
    case 'close': dlgClose(); break;
    case 'reload': S.loadError = null; render(); loadAll(); break;
    case 'logout': dlgClose(); await sb.auth.signOut(); break;
    case 'new-ticket': openTicketForm(null); break;
    case 'open-ticket': if(id) openTicket(id); else dlgClose(); break;
    case 'edit-ticket': { const t = ticketById(S.detailId); if(t) openTicketForm(t); break; }
    case 'copy-ticket': { const t = ticketById(S.detailId); if(t) copyText(ticketText(t)); break; }
    case 'delete-ticket': {
      if(!arm(b, 'Usunąć na zawsze? Kliknij ponownie')) return;
      const tid = S.detailId;
      if(await run(() => DB.remove('tickets', tid))){
        S.evidence.forEach(x => { if(x.ticketId === tid) x.ticketId = null; });
        dlgClose(); render(); toast('Usunięto zgłoszenie');
      }
      break;
    }
    case 'delete-event': {
      if(!arm(b, 'Na pewno?')) return;
      const t = ticketById(S.detailId); if(!t) return;
      await run(() => DB.update('tickets', t.id, {events:(t.events || []).filter(x => x.id !== id)}));
      break;
    }
    case 'ping-template': insertPingTemplate(); break;
    case 'new-evidence': openEvidenceForm(null, b.dataset.ticket || null); break;
    case 'open-evidence': openEvidence(id); break;
    case 'edit-evidence': { const ev = S.evidence.find(x => x.id === S.evidenceId); if(ev) openEvidenceForm(ev); break; }
    case 'delete-evidence': {
      if(!arm(b, 'Usunąć razem z plikami? Kliknij ponownie')) return;
      const ev = S.evidence.find(x => x.id === S.evidenceId); if(!ev) return;
      if(await run(() => DB.remove('evidence', ev.id))){
        Files.remove((ev.files || []).map(f => f.id));
        dlgClose(); toast('Usunięto dowód');
      }
      break;
    }
    case 'ev-cancel': { const back = S.evDraft && S.evDraft.returnTo; cleanupEvDraft(); if(back) openTicket(back); else dlgClose(); break; }
    case 'ev-remove-file': {
      const d = S.evDraft; if(!d) return;
      const f = d.files.splice(Number(b.dataset.i), 1)[0];
      if(f){
        if(d.newIds.includes(f.id)){ d.newIds = d.newIds.filter(x => x !== f.id); Files.remove([f.id]); }
        else d.removed.push(f.id);
      }
      renderEvThumbs(); break;
    }
    case 'edit-entry': openEntryForm(id); break;
    case 'delete-entry':
      if(!arm(b, 'Na pewno? Kliknij ponownie')) return;
      if(await run(() => DB.remove('journal', id))){ dlgClose(); toast('Usunięto wpis'); }
      break;
    case 'more-days': S.jf.limitDays += 40; render(); break;
    case 'jf-co': S.jf.company = b.dataset.v; render(); break;
    case 'tf-status': S.tf.status = b.dataset.v; render(); break;
    case 'ef-co': S.ef.company = b.dataset.v; render(); break;
    case 'copy-journal': copyText(journalReport(journalFiltered())); break;
    case 'download-journal': saveFile('dziennik-' + todayStr() + '.md', journalReport(journalFiltered()), 'text/markdown;charset=utf-8'); break;
    case 'report-tickets': saveFile('raport-guestsage-' + todayStr() + '.md', ticketsReport(), 'text/markdown;charset=utf-8'); break;
    case 'copy-report': copyText(ticketsReport()); break;
    case 'csv-tickets': saveFile('zgloszenia-guestsage-' + todayStr() + '.csv', ticketsCsv(), 'text/csv;charset=utf-8'); break;
    case 'backup': saveFile('dziennik-guestsage-kopia-' + todayStr() + '.json', JSON.stringify({exportedAt:new Date().toISOString(), settings:S.settings, tickets:S.tickets, journal:S.journal, evidence:S.evidence}, null, 2), 'application/json'); break;
  }
});
document.addEventListener('submit', async e => {
  const f = e.target.closest('form[data-form]'); if(!f) return;
  e.preventDefault();
  const btn = f.querySelector('[type=submit]'); if(btn) btn.disabled = true;
  try{
    switch(f.dataset.form){
      case 'login': await doLogin(); break;
      case 'journal-quick': await submitJournalQuick(f); break;
      case 'journal-edit': {
        const id = f.dataset.id, text = ($('#jeText').value || '').trim();
        if(!text){ toast('Wpis nie może być pusty.'); break; }
        if(await run(() => DB.update('journal', id, {text, company:$('#jeCo').value, date:$('#jeDate').value || todayStr()}))){ dlgClose(); toast('Zapisano'); }
        break;
      }
      case 'ticket': await submitTicket(f); break;
      case 'event': await submitEvent(); break;
      case 'evidence': await submitEvidence(); break;
      case 'settings': {
        const th = Math.max(1, Math.min(60, parseInt($('#sThreshold').value, 10) || 3));
        const sd = Math.max(1, Math.min(120, parseInt($('#sStale').value, 10) || 7));
        if(await run(() => DB.saveSettings({threshold:th, staleDays:sd}))){ toast('Zapisano progi'); dlgClose(); }
        break;
      }
    }
  } finally { if(btn && btn.isConnected && !(S.evDraft && S.evDraft.uploading)) btn.disabled = false; }
});
document.addEventListener('change', async e => {
  const el = e.target;
  if(el.id === 'evFiles'){ await uploadFiles(el.files); el.value = ''; return; }
  const c = el.dataset && el.dataset.change; if(!c) return;
  if(c === 'tf-co'){ S.tf.company = el.value; render(); }
  else if(c === 'tf-sort'){ S.tf.sort = el.value; render(); }
  else if(c === 'jf-range'){ S.jf.range = el.value; S.jf.limitDays = 40; render(); }
  else if(c === 'detail-status'){
    const t = ticketById(S.detailId); if(!t || el.value === t.status) return;
    const events = (t.events || []).concat([{id:uid(), at:nowLocal(), kind:'status', text:'Status: ' + STATUSES[el.value].label}]);
    if(await run(() => DB.update('tickets', t.id, {status:el.value, events, updatedAt:new Date().toISOString()}))) toast('Status: ' + STATUSES[el.value].label);
  }
});
document.addEventListener('input', e => {
  const c = e.target.dataset && e.target.dataset.input; if(!c) return;
  if(c === 'tf-q') S.tf.q = e.target.value;
  else if(c === 'jf-q') S.jf.q = e.target.value;
  else if(c === 'ef-q') S.ef.q = e.target.value;
  render();
});
document.addEventListener('keydown', e => {
  if(e.key === 'Enter' && (e.ctrlKey || e.metaKey) && e.target.tagName === 'TEXTAREA'){
    const f = e.target.closest('form[data-form]'); if(f){ e.preventDefault(); f.requestSubmit(); }
  }
});
document.addEventListener('paste', e => {
  if(!S.evDraft) return;
  const files = Array.from((e.clipboardData && e.clipboardData.files) || []).filter(f => f.type.startsWith('image/'));
  if(files.length){ e.preventDefault(); uploadFiles(files); }
});
document.addEventListener('dragover', e => { const d = e.target.closest && e.target.closest('#evDrop'); if(d){ e.preventDefault(); d.classList.add('over'); } });
document.addEventListener('dragleave', e => { const d = e.target.closest && e.target.closest('#evDrop'); if(d) d.classList.remove('over'); });
document.addEventListener('drop', e => { const d = e.target.closest && e.target.closest('#evDrop'); if(d){ e.preventDefault(); d.classList.remove('over'); uploadFiles(e.dataTransfer.files); } });
window.addEventListener('hashchange', () => { const v = location.hash.slice(1); if(RENDER[v] && v !== S.view) go(v); });
document.addEventListener('visibilitychange', () => {
  if(document.visibilityState !== 'visible' || !S.user) return;
  if(Date.now() - urlsAt > 10 * 3600e3){ URLS.clear(); urlsAt = Date.now(); }
  if(Date.now() - S.lastLoad > 60e3 && !dlg.open) loadAll();
});

/* ---------- auth ---------- */
async function doLogin(){
  const err = $('#lgErr'); err.hidden = true;
  if(!sb){ err.textContent = 'Panel nie jest jeszcze połączony z bazą. Uzupełnij config.js.'; err.hidden = false; return; }
  const email = $('#lgEmail').value.trim(), password = $('#lgPass').value;
  const {error} = await sb.auth.signInWithPassword({email, password});
  if(error){
    err.textContent = /invalid login|invalid credentials/i.test(error.message) ? 'Nieprawidłowy e-mail lub hasło.'
      : /email not confirmed/i.test(error.message) ? 'Konto nie jest potwierdzone. W Supabase zaznacz „Auto Confirm User”.'
      : errMsg(error);
    err.hidden = false;
  } else $('#lgPass').value = '';
}
function onSession(session){
  const user = session && session.user;
  if(user && (!S.user || S.user.id !== user.id)){
    S.user = user; S.ready = false; S.loadError = null;
    render();
    setTimeout(loadAll, 0);
  } else if(!user && S.user){
    S.user = null; S.ready = false; S.tickets = []; S.journal = []; S.evidence = []; URLS.clear();
    dlgClose(); render();
  } else if(user) S.user = user;
}

/* ---------- theme ---------- */
const THEME_ICONS = {
  auto:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 000 16z" fill="currentColor"/></svg>',
  light:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
  dark:'<svg viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 019.5 4a8 8 0 1010.5 10.5z"/></svg>'
};
const THEME_LABEL = { auto:'Motyw: automatyczny', light:'Motyw: jasny', dark:'Motyw: ciemny' };
function getTheme(){ const t = lsGet('theme', 'auto'); return THEME_LABEL[t] ? t : 'auto'; }
function applyTheme(t, animate){
  const root = document.documentElement;
  if(animate && !reducedMotion()){
    root.classList.add('theme-anim');
    clearTimeout(applyTheme._t); applyTheme._t = setTimeout(() => root.classList.remove('theme-anim'), 500);
  }
  if(t === 'auto') root.removeAttribute('data-theme'); else root.setAttribute('data-theme', t);
  lsSet('theme', t);
  const dark = t === 'dark' || (t === 'auto' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
  const meta = document.querySelector('meta[name="theme-color"]'); if(meta) meta.content = dark ? '#0F113C' : '#191C63';
  document.querySelectorAll('.theme-btn').forEach(b => { b.innerHTML = THEME_ICONS[t]; b.title = THEME_LABEL[t]; b.setAttribute('aria-label', THEME_LABEL[t] + '. Kliknij, aby zmienić.'); });
  document.querySelectorAll('[data-theme-opt]').forEach(b => b.classList.toggle('on', b.dataset.themeOpt === t));
}
if(window.matchMedia){
  const mq = matchMedia('(prefers-color-scheme: dark)');
  const onChange = () => { if(getTheme() === 'auto') applyTheme('auto', true); };
  if(mq.addEventListener) mq.addEventListener('change', onChange); else if(mq.addListener) mq.addListener(onChange);
}

function init(){
  applyTheme(getTheme(), false);
  const h = location.hash.slice(1);
  S.view = RENDER[h] ? h : (RENDER[lsGet('view', '')] ? lsGet('view', '') : 'pulpit');
  if(!sb){ $('#cfgNotice').hidden = false; render(); return; }
  sb.auth.onAuthStateChange((event, session) => { onSession(session); });
  sb.auth.getSession().then(({data}) => onSession(data && data.session));
  render();
}
init();
})();
